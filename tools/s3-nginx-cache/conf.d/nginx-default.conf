# /etc/nginx/conf.d/nginx-default.conf: proxy + cache S3 tới Ceph RGW
proxy_cache_path /data/cache levels=2:2:2 keys_zone=mycache:999m max_size=20G inactive=1d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=rate:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

upstream rgws {
    server 192.168.69.190:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen       80;
    server_name  khactamm27.id.vn *.khactamm27.id.vn;

    # Subrequest xác thực: gửi chữ ký gốc của client lên RGW (header x-rgw-auth) để RGW kiểm tra quyền.
    # Các request không cache được (list, PUT, POST, HEAD, DELETE, có query string...) bỏ qua bước này
    # vì RGW sẽ tự xác thực khi nhận request thật.
    location /authentication {
        internal;
        client_max_body_size 0;
        proxy_pass http://rgws$request_uri;
        proxy_pass_request_body off;
        proxy_set_header Host $host;
        proxy_set_header x-rgw-auth "yes";
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_method $request_method;
        proxy_cache_convert_head off;
        error_page 404 = @outage;
        proxy_intercept_errors on;

        if ($request_uri = "/") { return 200; }
        if ($request_uri ~* (\?)) { return 200; }
        if ($request_method = "PUT") { return 200; }
        if ($request_method = "POST") { return 200; }
        if ($request_method = "HEAD") { return 200; }
        if ($request_method = "COPY") { return 200; }
        if ($request_method = "DELETE") { return 200; }
        if ($http_if_match) { return 200; }
        if ($http_authorization !~* "aws4_request") { return 200; }
    }

    location @outage { return 403; }

    location / {
        auth_request /authentication;
        proxy_pass http://rgws;
        set $authvar '';
        set $do_not_cache '';
        rewrite_by_lua_file /etc/nginx/nginx-lua-file.lua;

        proxy_cache mycache;
        proxy_cache_lock_timeout 0s;
        proxy_cache_lock_age 1000s;
        proxy_http_version 1.1;
        set $date $http_x_amz_date;
        proxy_set_header Host $host;
        proxy_cache_valid 200 206 1d;
        proxy_cache_use_stale updating;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_convert_head off;

        # Không cache: list ("/" hoặc có query string) và mọi thao tác ghi/HEAD.
        if ($request_uri = "/") { set $do_not_cache "no"; }
        if ($request_uri ~* (\?)) { set $do_not_cache "no"; }
        if ($request_method = "PUT") { set $do_not_cache "no"; }
        if ($request_method = "POST") { set $do_not_cache "no"; }
        if ($request_method = "HEAD") { set $do_not_cache "no"; }
        if ($request_method = "COPY") { set $do_not_cache "no"; }
        if ($request_method = "DELETE") { set $do_not_cache "no"; }

        proxy_set_header if_match $http_if_match;
        proxy_set_header x-amz-date $date;
        proxy_set_header X-Amz-Cache $authvar;
        proxy_no_cache $do_not_cache;
        proxy_set_header Authorization $awsauthfour;
        add_header X-Cache-Status $upstream_cache_status;
        # Khóa cache KHÔNG gồm Authorization: object đã cache được trả cho mọi người biết URL (xem mục 7.1 của bài).
        proxy_cache_key "$request_uri$request_method$request_body";
        limit_req zone=rate burst=20;
        client_max_body_size 0;
    }
}
