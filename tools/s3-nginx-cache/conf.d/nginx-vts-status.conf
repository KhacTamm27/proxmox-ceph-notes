# /etc/nginx/conf.d/nginx-vts-status.conf: dashboard traffic tại http://<proxy>:8090/status
# Trang này không có xác thực: chỉ mở cho mạng quản trị (xem mục 7.4 của bài).
server {
    listen 8090;
    server_name _;
    vhost_traffic_status_filter_by_host on;
    vhost_traffic_status_filter_by_set_key $status $server_name;
    proxy_buffering off;
    proxy_http_version 1.1;
    client_max_body_size 0;

    location /status {
        # Bỏ comment và sửa dải mạng để chỉ cho mạng quản trị xem:
        # allow 192.168.69.0/24;
        # deny all;
        vhost_traffic_status_bypass_limit on;
        vhost_traffic_status_bypass_stats on;
        vhost_traffic_status_display;
        vhost_traffic_status_display_format html;
    }
}
