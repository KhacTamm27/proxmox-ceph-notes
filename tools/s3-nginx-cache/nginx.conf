# /etc/nginx/nginx.conf trên S3-VTS-NGINX (OpenResty 1.29.2.1 + nginx-aws-auth-module + nginx-module-vts)
# Điền secret_key của user aws_cache trước khi dùng; file có khóa nên đặt quyền 600, chủ sở hữu root.
user  www-data;
worker_processes  auto;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    types_hash_max_size 4096;
    lua_package_path '/usr/local/openresty/lualib/?.lua;;';

    # NGINX ký lại request bằng user aws_cache (caps amz-cache=read) khi cần đọc object để cache.
    aws_auth $aws_token {
        access_key QTTT3AJFJGE9Y5G7M9AQ;
        secret_key <SECRET_KEY_CUA_aws_cache>;
        service s3;
        region none;
    }

    # Chọn header Authorization gửi lên RGW: chữ ký aws_cache chỉ dùng cho GET object (không phải "/",
    # không có query string, không có If-Match); mọi trường hợp khác giữ nguyên chữ ký của client.
    map $aws_token $awsauth {
        default $http_authorization;
        ~. $aws_token;
    }
    map $request_uri $awsauthtwo {
        "/" $http_authorization;
        "~\?" $http_authorization;
        default $awsauth;
    }
    map $request_method $awsauththree {
        default $awsauthtwo;
        "PUT" $http_authorization;
        "HEAD" $http_authorization;
        "POST" $http_authorization;
        "DELETE" $http_authorization;
        "COPY" $http_authorization;
    }
    map $http_if_match $awsauthfour {
        ~. $http_authorization;
        default $awsauththree;
    }

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    error_log /var/log/nginx/error.log;
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    vhost_traffic_status_zone shared:vhost_traffic_status:128m;
    vhost_traffic_status_dump /var/log/nginx/vts.db;
    vhost_traffic_status_filter_max_node 16 uris client::ports;

    include /etc/nginx/conf.d/*.conf;
}
