# Include these locations inside the existing server block serving port 80.
# Replace <VPN_CIDR> with the actual source range seen by this VM.
# Keep the API location before the general static-content location.

location ^~ /pve-diagnostic/api/ {
    allow <VPN_CIDR>;
    deny all;

    auth_basic "PVE Diagnostic";
    auth_basic_user_file /etc/nginx/pve-diagnostic.htpasswd;

    client_max_body_size 1k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Authenticated-User $remote_user;
}

location ^~ /pve-diagnostic/ {
    allow <VPN_CIDR>;
    deny all;

    auth_basic "PVE Diagnostic";
    auth_basic_user_file /etc/nginx/pve-diagnostic.htpasswd;

    autoindex off;
    index index.html;
    try_files $uri $uri/ =404;
}
