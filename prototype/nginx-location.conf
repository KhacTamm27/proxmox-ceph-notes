# Reverse proxy for the single-container deployment.
# Keep VPN/firewall restrictions on the host Nginx and retain Basic Auth.
# The container is published only on 127.0.0.1:18765.

location ^~ /pve-diagnostic/api/ {
    auth_basic "PVE Diagnostic";
    auth_basic_user_file /etc/nginx/pve-diagnostic.htpasswd;

    limit_except POST { deny all; }
    client_max_body_size 1k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Authenticated-User $remote_user;
    proxy_set_header Authorization "";
}

location ^~ /pve-diagnostic/ {
    auth_basic "PVE Diagnostic";
    auth_basic_user_file /etc/nginx/pve-diagnostic.htpasswd;

    autoindex off;
    charset utf-8;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Authenticated-User $remote_user;
    proxy_set_header Authorization "";
}
