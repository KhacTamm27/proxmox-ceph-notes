<script>
const DATA=/*__DATA__*/null,CASES=/*__CASES__*/[],CASE_META=/*__CASE_META__*/{},COMMAND_RISK=/*__COMMAND_RISK__*/{},RUNBOOK_META=/*__RUNBOOK_META__*/{},HEALTH=/*__HEALTH_CODES__*/{},SCRIPTS=/*__SCRIPTS__*/[],GUIDES=/*__GUIDES__*/[],TRIAGE=/*__TRIAGE__*/[],SYNONYMS=/*__SYNONYMS__*/[],TOPICS=/*__TOPICS__*/{},LABELS=/*__LABELS__*/{},DATES=/*__DATES__*/{},REPO="/*__REPO__*/",BUILD="/*__BUILD_DATE__*/";
const ENGINE=createSearch(SYNONYMS),INDEX=createIndex(ENGINE,{DATA,CASES,SCRIPTS,TRIAGE,GUIDES,TOPICS,LABELS});
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const GH='https://github.com/'+(REPO||'KhacTamm27/proxmox-ceph-notes');
$('#ghLink').href=GH;
/* ---------- icon ---------- */
const IC={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
cluster:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="8.5" y="14" width="7" height="7" rx="1.5"/><path d="M6.5 10v2h11v-2M12 12v2"/>',
vm:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',host:'<rect x="3" y="3" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/><path d="M7 6.5h.01M7 17.5h.01"/>',
net:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',db:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
layers:'<path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>',key:'<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3"/>',gauge:'<path d="m12 14 4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
cloud:'<path d="M17.5 19H7a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 11a4 4 0 0 1-1.5 8z"/>',term:'<path d="m4 17 6-6-6-6M12 19h8"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/>',
chev:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
pin:'<path d="M12 17v5M5 17h14l-2-4V5H7v8l-2 4z"/>',print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/>',link:'<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',flag:'<path d="M4 22V4h12l-2 4 2 4H4"/>',shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3z"/>',
warn:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',check:'<path d="m5 12 5 5 9-10"/>',
file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6z"/><path d="M14 3v6h6"/>',wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.4-.6-.6-2.4 2.4-2.4z"/>',
up:'<path d="M12 19V5M5 12l7-7 7 7"/>',zfs:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18"/>',move:'<path d="M4 12h16M14 6l6 6-6 6M10 18l-6-6 6-6"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;
/* ---------- dữ liệu dùng chung ---------- */
const SEVN={crit:'Nghiêm trọng',warn:'Cảnh báo',info:'Hướng dẫn'},SEV={'Nghiêm trọng':'crit','Cảnh báo':'warn','Hướng dẫn':'info'},RKL={ro:'chỉ đọc',chg:'thay đổi',dg:'nguy hiểm'};
const CASE_ICON={'OSD':'db','PG':'layers','MON':'key','Cluster & HA':'cluster','VM & Container':'vm','Storage & Backup':'host','Mạng':'net','RGW/S3':'cloud','Nâng cấp & di chuyển':'up','Khác':'file'};
const GDESC={'OSD':'OSD down, nearfull, thay đĩa','PG':'Inconsistent, degraded, recovery chậm','MON':'Mất quorum, lệch giờ','Cluster & HA':'Node offline, mất quorum, HA','VM & Container':'Bị lock, không start, console lỗi','Storage & Backup':'Đầy ổ, backup lỗi, NFS/iSCSI','Mạng':'MTU, bridge, bond, VLAN','RGW/S3':'503, 403, bucket index, key S3','Nâng cấp & di chuyển':'Nâng cấp, migrate lỗi','Khác':'Các sự cố khác'};
const RB_ICON={'Nâng cấp':'up','Bảo trì':'wrench','ZFS':'zfs','Storage':'db','Di chuyển VM':'move','Console':'vm'},RB_ORDER=['Nâng cấp','Bảo trì','ZFS','Storage','Di chuyển VM','Console'];
const RISKN={thap:['ok','Rủi ro thấp','Thấp'],tb:['warn','Rủi ro TB','Trung bình'],cao:['crit','Rủi ro cao','Cao']};
const HINT={'osd-id':'3',dev:'sdc','if':'bond0',ip:'10.10.10.12',node:'pve2',vmid:'100',pgid:'2.1f',user:'tên-user',pool:'rbd'};
const CASE_BY_ID=Object.fromEntries(CASES.map(c=>[c.id,c]));
const issueCases=CASES.filter(c=>c.kind!=='runbook'),runCases=CASES.filter(c=>c.kind==='runbook');
const sevOf=id=>SEV[(CASE_META[id]||{}).severity]||'info',grpOf=id=>(CASE_META[id]||{}).group||'Khác';
const scopeN=c=>c.scope==='ceph'?'Ceph':'Proxmox';
const hrefOf=c=>(c.kind==='runbook'?'#runbook/':'#case/')+c.id;
const cmdRisk=c=>COMMAND_RISK[c]||autoRisk(c);
const BN=b=>(LABELS.branches||{})[b.id]||b.name,SN=n=>(LABELS.subs||{})[n]||n;
const nc=ch=>ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')||ch;
const norm=s=>[...String(s||'')].map(c=>nc(c)[0]||c).join('');
const fmtD=d=>{const p=String(d||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''},fmtS=d=>{const p=String(d||'').split('-');return p.length===3?p[2]+'/'+p[1]:''};
const codesOf={};Object.entries(HEALTH).forEach(([k,v])=>{if(v.case_id)(codesOf[v.case_id]=codesOf[v.case_id]||[]).push(k)});
const allCmds=[];DATA.left.concat(DATA.right).forEach(b=>b.subs.forEach(s=>s.items.forEach(it=>allCmds.push({b,s,it}))));
const cmdInfo=c=>(allCmds.find(x=>x.it.c===c)||{}).it;
function hl(text,toks){const n=norm(text),mark=new Array(text.length).fill(false);toks.forEach(t=>{if(!t)return;let i=n.indexOf(t);while(i>-1){for(let k=i;k<i+t.length;k++)mark[k]=true;i=n.indexOf(t,i+1)}});let o='',on=false;[...text].forEach((c,i)=>{if(mark[i]&&!on){o+='<mark>';on=true}if(!mark[i]&&on){o+='</mark>';on=false}o+=esc(c)});return o+(on?'</mark>':'')}
const toksOf=q=>norm(q.trim()).split(/\s+/).filter(Boolean);
function lsGet(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}}function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let VARS=lsGet('v6-vars',{});if(typeof VARS!=='object'||Array.isArray(VARS))VARS={};
const pinsGet=()=>lsGet('v6-pins',[]),recentGet=()=>lsGet('v6-recent',[]);
function recentAdd(id){const k=CASE_BY_ID[id]&&CASE_BY_ID[id].kind==='runbook'?'runbook':'case';lsSet('v6-recent',[{id,kind:k}].concat(recentGet().filter(x=>x.id!==id)).slice(0,8))}
function pinToggle(id){const a=pinsGet(),i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);else a.unshift({id,kind:CASE_BY_ID[id].kind==='runbook'?'runbook':'case'});lsSet('v6-pins',a);return i<0}
const lstHTML=(arr,empty)=>{const li=arr.map(x=>CASE_BY_ID[x.id]).filter(Boolean).map(c=>`<li><a href="${hrefOf(c)}"><span>${esc(c.title)}</span><span class="k">${c.kind==='runbook'?'Quy trình':'Sự cố'}</span></a></li>`).join('');return li||`<li class="emp">${empty}</li>`};
/* ---------- khối lệnh + biến ---------- */
function cb(cmd,note){const r=cmdRisk(cmd);return `<div class="cb ${r}"><div class="cbh"><span class="rk ${r}">${RKL[r]}</span><button class="cpy" type="button" data-act="copyc">${ic('copy','s')}<span>Sao chép</span></button></div><pre data-tpl="${esc(cmd)}">${esc(cmd)}</pre>${note?`<div class="cnote">${esc(note)}</div>`:''}</div>`}
const PH=/<([A-Za-z][\w.-]*)>/g;
function varsBox(cmds){const names=[...new Set(cmds.flatMap(c=>[...c.matchAll(PH)].map(m=>m[1])))];if(!names.length)return '';return `<section class="vars no-print" id="vars"><div class="vh">${ic('term','s')}<b>Điền giá trị một lần</b><span>mọi lệnh trên trang tự cập nhật, bấm Sao chép là ra lệnh đúng</span><button type="button" id="vreset">Xóa</button></div><div class="vg">${names.map(n=>`<label>${esc(n)}<input data-var="${esc(n)}" placeholder="${HINT[n]?'vd: '+esc(HINT[n]):''}" autocomplete="off" spellcheck="false"></label>`).join('')}</div></section>`}
function renderVars(){$$('pre[data-tpl]').forEach(p=>{const h=esc(p.dataset.tpl).replace(/&lt;([A-Za-z][\w.-]*)&gt;/g,(m,k)=>VARS[k]?`<span class="v">${esc(VARS[k])}</span>`:`<span class="vp">&lt;${k}&gt;</span>`);p.innerHTML=h})}
function bindVars(){$$('[data-var]').forEach(i=>{i.value=VARS[i.dataset.var]||'';i.oninput=()=>{VARS[i.dataset.var]=i.value.trim();lsSet('v6-vars',VARS);renderVars()}});const r=$('#vreset');if(r)r.onclick=()=>{$$('[data-var]').forEach(i=>i.value='');VARS={};try{localStorage.removeItem('v6-vars')}catch(e){}renderVars()};renderVars()}
function copyText(t,done){const ok=()=>done&&done();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>{});else{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()}}
function flash(btn,label){const s=btn.querySelector('span')||btn,old=s.textContent;btn.classList.add('ok');s.textContent=label||'Đã chép';setTimeout(()=>{btn.classList.remove('ok');s.textContent=old},1500)}
/* ---------- khung chung ---------- */
const crumb=a=>`<div class="crumb">${a.map(x=>x[1]?`<a href="${x[1]}">${esc(x[0])}</a>`:esc(x[0])).join(' <span>/</span> ')}</div>`;
const sideA=(label,count,on,attrs,icon,dot)=>`<a ${on?'class="on" ':''}${attrs}>${dot?`<span class="dot ${dot}"></span>`:''}${icon?ic(icon,'s'):''}<span>${esc(label)}</span>${count!=null?`<i>${count}</i>`:''}</a>`;
const ctaRisk=`<div class="cta"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC.shield}</svg><div><b>Mức rủi ro lệnh</b><p class="lg"><span><span class="rk ro">chỉ đọc</span> an toàn</span><span><span class="rk chg">thay đổi</span> cần cân nhắc</span><span><span class="rk dg">nguy hiểm</span> ảnh hưởng dữ liệu</span></p></div></div>`;
const ctaSearch=`<div class="cta">${ic('search')}<div><b>Không thấy case?</b><p>Nhấn <kbd>Ctrl K</kbd> rồi dán nguyên câu lỗi.</p></div></div>`;
/* ================= TRANG CHỦ ================= */
function pHome(){
  const crit=issueCases.filter(c=>sevOf(c.id)==='crit').length,warn=issueCases.filter(c=>sevOf(c.id)==='warn').length;
  const tl=['PG_DAMAGED','MON_DOWN','OSD_NEARFULL','SLOW_OPS'].filter(k=>HEALTH[k]&&CASE_BY_ID[HEALTH[k].case_id]).map(k=>{const h=HEALTH[k],c=CASE_BY_ID[h.case_id];return `<div class="tl"><span class="tk ${SEV[h.severity]==='crit'?'crit':'warn'}">${k}</span><span class="tm">${esc(h.desc)}</span><a class="tcase" href="${hrefOf(c)}">${ic('arrow','s')}<span>${esc(c.title)}</span></a></div>`}).join('');
  const strip=[['crit',crit,'Sự cố nghiêm trọng','#cases-crit'],['warn',warn,'Cảnh báo','#cases-warn'],['',allCmds.length,'Lệnh · '+(DATA.left.length+DATA.right.length)+' nhóm','#map'],['',runCases.length+SCRIPTS.length,'Quy trình &amp; script','#cases-run'],['',GUIDES.length,'Bài viết chuyên đề','#guides']].map(([c,n,l,h])=>`<a class="si ${c}" href="${h}"><span class="sv">${n}</span><span class="sl2">${l}</span></a>`).join('');
  const groups={};issueCases.forEach(c=>(groups[grpOf(c.id)]=groups[grpOf(c.id)]||[]).push(c));

    const hc=Object.keys(HEALTH).filter(k=>norm(k.replace(/_/g,' ')).includes(toks.join(' '))||toks.every(t=>norm(k).includes(t)));
    total=cs.length+cm.length+rbs.length+sc.length+gd.length+hc.length;
    if(!total){body.classList.add('noprev');pres.innerHTML=`<div class="pempty"><b>Không tìm thấy “${esc(query)}”</b><p>Thử bỏ bớt từ, gõ không dấu, hoặc dán phần chính của câu lỗi (vd: <code>no quorum</code> thay vì cả dòng log).</p><p>Hoặc xem theo nhóm: <a href="#cases-g:OSD">OSD</a> · <a href="#cases-g:PG">PG</a> · <a href="#cases-g:${encodeURIComponent('Cluster & HA')}">Cluster &amp; HA</a> · <a href="#cases-g:${encodeURIComponent('RGW/S3')}">RGW / S3</a></p></div>`;$('#pprev').innerHTML='';pc.textContent='0 kết quả';sel=0;return}
    if(total===1&&cs.length===1)h+='<div class="pexact">✓ Khớp chính xác 1 sự cố. Nhấn Enter để mở.</div>';
    const more=(n,max,name,go)=>n>max?`<a class="pall" data-act="pall" data-go="${go}">Xem tất cả ${n} ${name} →</a>`:'';
    if(cs.length)h+=grpH('Sự cố',cs.length,cs.slice(0,6).map(c=>rowCase(c,toks)).join('')+more(cs.length,6,'sự cố','cases'));
    if(hc.length)h+=grpH('Mã health',hc.length,hc.slice(0,3).map(k=>{const hh=HEALTH[k];return `<div class="pr" data-i="${flat.push({t:'health',k})-1}"><span class="dot ${SEV[hh.severity]||'info'}"></span><div class="prb"><div><code class="pcmd">${hl(k,toks)}</code></div><code style="font-family:var(--font)">${esc(hh.desc)}</code></div><span class="pf">Ceph</span></div>`}).join(''));
    if(cm.length)h+=grpH('Lệnh',cm.length,cm.slice(0,5).map(x=>{const rk=cmdRisk(x.it.c);return `<div class="pr" data-i="${flat.push({t:'cmd',x})-1}"><code class="pcmd">${hl(x.it.c,toks)}</code><div class="prb sm">${hl(x.it.v||x.it.p||'',toks)}</div><span class="rk ${rk}">${RKL[rk]}</span></div>`}).join('')+more(cm.length,5,'lệnh','commands'));
    if(rbs.length||sc.length)h+=grpH('Quy trình',rbs.length+sc.length,rbs.slice(0,4).map(c=>`<div class="pr" data-i="${flat.push({t:'rb',c})-1}">${ic('book','s')}<div class="prb"><div>${hl(c.title,toks)}</div></div><span class="pf">${esc((RUNBOOK_META[c.id]||{}).group||'Quy trình')}</span></div>`).join('')+sc.slice(0,3).map(s=>`<div class="pr" data-i="${flat.push({t:'script',s})-1}">${ic('file','s')}<div class="prb"><div>${hl(s.title,toks)}</div><code>${esc(s.file)}</code></div><span class="pf">Script</span></div>`).join('')+more(rbs.length+sc.length,7,'quy trình','workflows'));
    if(gd.length)h+=grpH('Bài viết',gd.length,gd.slice(0,3).map(g=>`<div class="pr" data-i="${flat.push({t:'guide',g})-1}">${ic('book','s')}<div class="prb"><div>${hl(g.title,toks)}</div></div><span class="pf">Bài viết</span></div>`).join(''));
  }
  pres.innerHTML=h;pc.textContent=total+' kết quả';sel=0;paintP();
}
function paintP(){
  $$('.pr',$('#pres')).forEach(e=>e.classList.toggle('sel',+e.dataset.i===sel));
  const x=flat[sel],p=$('#pprev');if(!x){p.innerHTML='';return}
  if(x.t==='case'){const c=x.c,m=CASE_META[c.id]||{},s=sevOf(c.id);p.innerHTML=`<div class="pvk">Sự cố · ${scopeN(c)} · ${esc(grpOf(c.id))}</div><h4>${esc(c.title)}</h4><span class="sev ${s}">${SEVN[s]}</span>${m.error_line?`<div class="pvl">Câu lỗi / dấu hiệu</div><code class="pvc">${esc(m.error_line)}</code>`:''}<div class="pvl">Trong trang này</div><ul>${['Triệu chứng','Nguyên nhân','Các bước xử lý','Lưu ý'].map(l=>`<li>${l}</li>`).join('')}</ul><div class="pvb">Enter để mở case</div>`}
  else if(x.t==='cmd'){const rk=cmdRisk(x.x.it.c);p.innerHTML=`<div class="pvk">Lệnh · ${esc(SN(x.x.s.name))}</div><code class="pvc big">${esc(x.x.it.c)}</code><p>${esc(x.x.it.v||x.x.it.p||'')}</p><span class="rk ${rk}">${RKL[rk]}</span><div class="pvb">Enter để sao chép</div>`}
  else if(x.t==='health'){const hh=HEALTH[x.k];p.innerHTML=`<div class="pvk">Mã health</div><code class="pvc big">${x.k}</code><p>${esc(hh.desc)}</p><span class="sev ${SEV[hh.severity]||'info'}">${esc(hh.severity)}</span><div class="pvb">Enter để mở ${CASE_BY_ID[hh.case_id]?'case xử lý':'bảng mã health'}</div>`}
  else if(x.t==='rb'){const m=RUNBOOK_META[x.c.id]||{};p.innerHTML=`<div class="pvk">Quy trình · ${esc(m.group||'')}</div><h4>${esc(x.c.title)}</h4><p>${m.duration?'Thời gian ước tính: '+esc(m.duration):''}</p><div class="pvb">Enter để mở</div>`}
  else if(x.t==='script')p.innerHTML=`<div class="pvk">Script</div><h4>${esc(x.s.title)}</h4><code class="pvc">${esc(x.s.file)}</code><p>${esc(x.s.goal||'')}</p><div class="pvb">Enter để mở</div>`;
  else p.innerHTML=`<div class="pvk">Bài viết</div><h4>${esc(x.g.title)}</h4><p>${esc(x.g.summary||'')}</p><div class="pvb">Enter để mở</div>`;
}
function activate(i){
  const x=flat[i];if(!x)return;
  if(x.t==='cmd'){copyText(x.x.it.c);closeP();return}
  closeP();
  if(x.t==='case'||x.t==='rb')location.hash=hrefOf(x.c);
  else if(x.t==='health'){const c=CASE_BY_ID[HEALTH[x.k].case_id];location.hash=c?hrefOf(c):'#health'}
  else if(x.t==='script')window.open(scriptHref(x.s),'_blank');
  else window.open((REPO?GH+'/blob/main/':'../')+x.g.file,'_blank');
}
pq.addEventListener('input',()=>runP(pq.value));
ov.addEventListener('click',e=>{if(e.target===ov){closeP();return}const pall=e.target.closest('.pall');if(pall){const q=pq.value;closeP();const go=pall.dataset.go;if(go==='cases'){location.hash='#cases';setTimeout(()=>{ST.q=q;$('#fi').value=q;updCases()},0)}else if(go==='commands'){location.hash='#map';setTimeout(()=>{SC.q=q;$('#cfi').value=q;updCommands()},0)}else{location.hash='#cases-run';setTimeout(()=>{SW.q=q;$('#wfi').value=q;updWorkflows()},0)}return}const r=e.target.closest('.pr');if(r)activate(+r.dataset.i)});
ov.addEventListener('mouseover',e=>{const r=e.target.closest('.pr');if(r&&+r.dataset.i!==sel){sel=+r.dataset.i;paintP()}});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openP();return}
  if(ov.hidden)return;
  if(e.key==='Escape')closeP();
  else if(e.key==='ArrowDown'){sel=Math.min(sel+1,flat.length-1);paintP();const s=$('.pr.sel');if(s)s.scrollIntoView({block:'nearest'});e.preventDefault()}
  else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);paintP();const s=$('.pr.sel');if(s)s.scrollIntoView({block:'nearest'});e.preventDefault()}
  else if(e.key==='Enter'){activate(sel);e.preventDefault()}
});
$('#openSearch').addEventListener('click',()=>openP());
document.addEventListener('click',e=>{if(e.target.closest('#bigSearch'))openP()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='bigSearch')openP()});
window.addEventListener('hashchange',route);
route();
try{const q=new URLSearchParams(location.search).get('q');if(q)openP(q)}catch(e){}
</script>
