<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxmox + Ceph command mindmap</title>
<meta name="description" content="Cheatsheet lệnh Proxmox VE và Ceph, tìm theo từ khóa, mở thẳng từng mục qua #A1, #B13">
<style>
:root{--bg:#fbfbfa;--panel:#fff;--ink:#1c2330;--muted:#5d6877;--line:#d8dde4;--pve:#b4520a;--pve-soft:#fbeee2;--ceph:#0b6b86;--ceph-soft:#e6f3f7;--danger:#b3261e;--root:#1c2330;--rootink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1a2029;--ink:#e6e9ee;--muted:#9aa5b4;--line:#2c3542;--pve:#f0a061;--pve-soft:#2b2017;--ceph:#5cc0dc;--ceph-soft:#12262d;--danger:#ff8a80;--root:#e6e9ee;--rootink:#12161c}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:600;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{width:260px;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.tools button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
:focus-visible{outline:2px solid var(--ceph);outline-offset:2px}
#map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);gap:0 16px;padding:20px;max-width:1500px;margin:0 auto}
#wires{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.w{fill:none;stroke-width:1.5;opacity:.55}
.w.left{stroke:var(--pve)}
.w.right{stroke:var(--ceph)}
.side{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.side.left{text-align:right}
.sidehead{font-size:13px;color:var(--muted);margin:0 0 4px}
.hub{position:relative;z-index:1}
.root{position:sticky;top:42vh;display:flex;align-items:center;justify-content:center;text-align:center;min-height:84px;padding:12px;border-radius:14px;background:var(--root);color:var(--rootink);font-weight:600;font-size:17px;line-height:1.25}
.branch{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.branch.left{border-right:4px solid var(--pve)}
.branch.right{border-left:4px solid var(--ceph)}
.bhead{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:transparent;text-align:inherit}
.branch.left .bhead{flex-direction:row-reverse}
.bid{font:600 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:2px 7px;border-radius:5px}
.left .bid{background:var(--pve-soft);color:var(--pve)}
.right .bid{background:var(--ceph-soft);color:var(--ceph)}
.bname{flex:1;font-weight:600}
.bcount{color:var(--muted);font-size:12.5px}
.bbody{padding:2px 14px 12px;border-top:1px solid var(--line)}
.subname{margin:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{padding:5px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
code{font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;word-break:break-word;cursor:copy}
.why{display:block;color:var(--muted);font-size:12.5px}
li.danger code{color:var(--danger)}
[hidden]{display:none!important}
.gh{display:inline-block;margin:8px 0 0;font-size:12.5px;color:var(--ceph)}
.branch:target{box-shadow:0 0 0 2px var(--ceph)}
@media (max-width:860px){
#map{grid-template-columns:1fr;padding:12px}
#wires{display:none}
.hub{order:-1;margin-bottom:8px}
.root{position:static;min-height:56px}
.side.left{text-align:left}
.branch.left{border-right:1px solid var(--line);border-left:4px solid var(--pve)}
.branch.left .bhead{flex-direction:row}
}

.tools .tab[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:1500px;margin:0 auto;padding:10px 20px 0}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--muted)}
.vi{display:block;font-size:13px}
#results,#cases{max-width:1100px;margin:0 auto;padding:12px 20px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.rrow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.rrow a{font:600 12px ui-monospace,Menlo,Consolas,monospace;text-decoration:none;color:var(--ceph)}
.rcase{display:block;padding:6px 0;color:var(--ceph)}
details.case{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 8px;padding:0 14px}
details.case summary{padding:10px 0;font-weight:600;cursor:pointer}
details.case ol{padding-left:20px;margin:6px 0}
details.case ol li{border:0;padding:4px 0}
.cmdline{display:block;margin:2px 0 6px}
.note{color:var(--muted);font-size:13px}
.pbtn{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px}
</style>
</head>
<body>
<header class="top">
<h1>Proxmox + Ceph command mindmap</h1>
<div class="tools">
<input id="q" type="search" placeholder="Filter commands" aria-label="Filter commands">
<button id="tabmap" class="tab" type="button" aria-pressed="true">Mindmap</button>
<button id="tabcase" class="tab" type="button" aria-pressed="false">Case study</button>
<button id="expand" type="button">Expand all</button>
<button id="collapse" type="button">Collapse all</button>
</div>
</header>
<div class="chips" id="chips" aria-label="Gợi ý tìm kiếm"></div>
<section id="results" hidden></section>
<section id="cases" hidden></section>
<main id="map">
<svg id="wires" aria-hidden="true"></svg>
<div class="side left" id="left"></div>
<div class="hub"><div class="root" id="root">Proxmox<br>+ Ceph</div></div>
<div class="side right" id="right"></div>
</main>

const REPO="";const SLUGS={"A1": "proxmox/A01-system-and-node.md", "A2": "proxmox/A02-cluster-and-corosync.md", "A3": "proxmox/A03-virtual-machines-qm.md", "A4": "proxmox/A04-containers-pct-and-templates.md", "A5": "proxmox/A05-storage-pvesm.md", "A6": "proxmox/A06-backup-and-restore.md", "A7": "proxmox/A07-high-availability-and-replication.md", "A8": "proxmox/A08-network.md", "A9": "proxmox/A09-firewall.md", "A10": "proxmox/A10-disks-and-filesystems.md", "A11": "proxmox/A11-hardware-and-performance.md", "A12": "proxmox/A12-access-control-pveum.md", "A13": "proxmox/A13-tasks-logs-and-api.md", "A14": "proxmox/A14-ceph-management-from-proxmox-pveceph.md", "B1": "ceph/B01-health-and-status.md", "B2": "ceph/B02-mon.md", "B3": "ceph/B03-mgr-and-modules.md", "B4": "ceph/B04-osd-status.md", "B5": "ceph/B05-osd-flags-and-maintenance.md", "B6": "ceph/B06-osd-lifecycle-and-devices.md", "B7": "ceph/B07-osd-daemon-and-performance-admin-socket.md", "B8": "ceph/B08-crush-map.md", "B9": "ceph/B09-pools.md", "B10": "ceph/B10-placement-groups.md", "B11": "ceph/B11-recovery-scrub-and-config-tuning.md", "B12": "ceph/B12-rbd-vm-disks.md", "B13": "ceph/B13-rgw-and-s3-radosgw-admin.md", "B14": "ceph/B14-cephfs.md", "B15": "ceph/B15-authentication-cephx.md", "B16": "ceph/B16-benchmarks-and-low-level-rados.md", "B17": "ceph/B17-upgrade-and-compatibility.md", "B18": "ceph/B18-troubleshooting-shortlist.md"};const CASES=[{"id": "osd-down-flapping", "title": "OSD down hoặc up/down liên tục (flapping)", "tags": "ceph osd down flapping rớt osd heartbeat", "symptoms": "ceph -s báo \"N osds down\", OSD lúc up lúc down, log có \"wrongly marked me down\" hoặc heartbeat_check no reply.", "causes": "Tiến trình OSD crash, đĩa lỗi, host thiếu RAM (OOM killer), card mạng lỗi hoặc MTU không khớp làm mất heartbeat.", "steps": [{"t": "Xác định OSD nào đang down và ở host nào", "cmds": ["ceph health detail", "ceph osd tree down"]}, {"t": "Đọc log OSD quanh thời điểm rớt, tìm crash, I/O error, OOM", "cmds": ["journalctl -u ceph-osd@<osd-id> --since \"1 hour ago\"", "ceph crash ls"]}, {"t": "Trên host: kiểm tra OOM và lỗi đĩa", "cmds": ["dmesg -T | grep -Ei 'oom|i/o error|blk_update'", "smartctl -a /dev/<dev>"]}, {"t": "Nếu nghi mạng (nhiều OSD cùng host flap): xem lỗi NIC, MTU, heartbeat", "cmds": ["ethtool -S <if>", "ceph config get osd osd_heartbeat_grace"]}, {"t": "Nếu cần dừng OSD để xử lý: kiểm tra an toàn và đặt noout trước", "cmds": ["ceph osd ok-to-stop <osd-id>", "ceph osd set noout"]}, {"t": "Khởi động lại OSD, theo dõi nó vào lại, rồi gỡ noout", "cmds": ["systemctl restart ceph-osd@<osd-id>", "ceph osd stat", "ceph osd unset noout"]}], "notes": "Đĩa lỗi thật (SMART xấu, I/O error lặp lại) thì thay đĩa, đừng restart mãi. Đừng out nhiều OSD cùng lúc khi cluster đang không khỏe."}, {"id": "pg-inconsistent", "title": "PG inconsistent / scrub errors", "tags": "ceph pg inconsistent scrub error hỏng dữ liệu repair", "symptoms": "HEALTH_ERR, \"pg x.y is active+clean+inconsistent\", \"N scrub errors\".", "causes": "Một bản sao của object khác các bản còn lại (bad sector, lỗi đĩa, lỗi bộ nhớ) bị deep-scrub phát hiện.", "steps": [{"t": "Lấy ID PG bị lỗi", "cmds": ["ceph health detail"]}, {"t": "Xem object nào và bản sao nằm trên OSD nào bị lỗi", "cmds": ["rados list-inconsistent-obj <pgid> --format=json-pretty", "ceph pg map <pgid>"]}, {"t": "Kiểm tra sức khỏe đĩa của OSD chứa bản lỗi", "cmds": ["smartctl -a /dev/<dev>", "journalctl -u ceph-osd@<osd-id> --since \"1 hour ago\""]}, {"t": "Sửa PG rồi theo dõi cho đến khi hết cảnh báo", "cmds": ["ceph pg repair <pgid>", "ceph -w"]}], "notes": "Xác định bản lỗi trước khi repair. Nếu cùng một OSD báo lỗi lặp lại thì đĩa đang hỏng, nên thay đĩa thay vì repair liên tục."}, {"id": "clock-skew", "title": "Clock skew trên MON (lệch giờ)", "tags": "ceph clock skew lệch giờ mất đồng bộ giờ ntp chrony mon", "symptoms": "HEALTH_WARN \"clock skew detected on mon.X\", MON mất quorum chập chờn.", "causes": "Đồng hồ các node lệch quá ngưỡng (mặc định 0.05 giây), NTP/chrony không chạy hoặc không tới được nguồn giờ.", "steps": [{"t": "Xem MON nào lệch bao nhiêu", "cmds": ["ceph time-sync-status"]}, {"t": "Trên node lệch: kiểm tra chrony và nguồn giờ", "cmds": ["chronyc tracking", "chronyc sources -v", "timedatectl"]}, {"t": "Khởi động lại chrony và ép chỉnh giờ", "cmds": ["systemctl restart chrony", "chronyc makestep"]}, {"t": "Kiểm tra lại sau vài phút", "cmds": ["ceph time-sync-status", "ceph health detail"]}], "notes": "Đảm bảo mọi node cùng trỏ về cùng nguồn NTP nội bộ. Nếu là VM, tắt đồng bộ giờ trùng lặp từ hypervisor."}, {"id": "pve-quorum-lost", "title": "Cluster Proxmox mất quorum", "tags": "proxmox pve quorum mất quorum corosync cluster not ready read-only không start vm", "symptoms": "GUI báo \"cluster not ready - no quorum\", /etc/pve chuyển read-only, không start được VM, node hiện đỏ.", "causes": "Mất liên lạc giữa các node (mạng, switch, firewall chặn UDP 5405-5412), quá nửa số node tắt, hoặc cluster 2 node thiếu QDevice.", "steps": [{"t": "Xem số phiếu và node nào đang thấy nhau", "cmds": ["pvecm status", "pvecm nodes"]}, {"t": "Kiểm tra link corosync giữa các node", "cmds": ["corosync-cfgtool -s", "journalctl -u corosync -f"]}, {"t": "Kiểm tra mạng: ping giữa các node qua mạng cluster, MTU, firewall", "cmds": ["ping -M do -s 1472 <node-ip>"]}, {"t": "Khi mạng đã ổn, restart stack cluster", "cmds": ["systemctl restart pve-cluster corosync"]}, {"t": "Khẩn cấp (chỉ khi chắc chắn các node kia đã tắt hẳn): ép quorum tạm thời", "cmds": ["pvecm expected 1"]}], "notes": "pvecm expected 1 có nguy cơ split-brain nếu node kia thật ra vẫn chạy và ghi dữ liệu. Với cluster 2 node nên thêm QDevice. pmxcfs -l là biện pháp cuối cùng."}, {"id": "nearfull-full", "title": "Ceph nearfull / full / pool đầy", "tags": "ceph nearfull full đầy disk dung lượng backfillfull osd đầy", "symptoms": "HEALTH_WARN \"N osd(s) nearfull\", HEALTH_ERR \"full osd(s)\", client không ghi được, backfill dừng.", "causes": "Dung lượng toàn cluster cạn, hoặc dữ liệu phân bố lệch làm một vài OSD đầy trước.", "steps": [{"t": "Xem dung lượng tổng và theo pool", "cmds": ["ceph df", "ceph health detail"]}, {"t": "Tìm OSD hoặc host đầy nhất, xem độ lệch", "cmds": ["ceph osd df tree", "ceph osd utilization"]}, {"t": "Nếu chỉ lệch: giảm tải OSD đầy", "cmds": ["ceph osd reweight-by-utilization", "ceph osd reweight <osd-id> 0.9"]}, {"t": "Giải phóng chỗ: xóa dữ liệu không cần hoặc thêm OSD, rồi theo dõi", "cmds": ["ceph -w"]}, {"t": "Khẩn cấp để mở ghi lại (chỉ tạm thời, trả về mặc định sau khi xử lý xong)", "cmds": ["ceph osd set-full-ratio 0.95"]}], "notes": "Không nâng ngưỡng full quá cao. Khi OSD chạm 100% có thể không khởi động được. Cluster nên giữ dưới khoảng 80% dung lượng."}, {"id": "slow-ops", "title": "Slow ops / blocked requests", "tags": "ceph slow ops blocked requests chậm treo latency io", "symptoms": "HEALTH_WARN \"N slow ops\", VM đơ hoặc IO chậm, \"requests are blocked\".", "causes": "Một OSD hoặc đĩa chậm, mạng nghẽn, recovery/scrub chiếm tải giờ cao điểm.", "steps": [{"t": "Xem OSD nào bị ảnh hưởng", "cmds": ["ceph health detail", "ceph osd perf"]}, {"t": "Trên host của OSD chậm: xem thao tác đang kẹt", "cmds": ["ceph daemon osd.<id> dump_ops_in_flight"]}, {"t": "Kiểm tra đĩa và mạng của host đó", "cmds": ["iostat -x 1", "ethtool -S <if>"]}, {"t": "Nếu recovery hoặc scrub đang chiếm tải: giảm tải và ưu tiên client", "cmds": ["ceph config set osd osd_max_backfills 1", "ceph config set osd osd_mclock_profile high_client_ops", "ceph osd set noscrub"]}], "notes": "Nhớ ceph osd unset noscrub sau khi xử lý xong. Một OSD có latency cao bất thường thường là đĩa sắp hỏng."}, {"id": "osd-replace-disk", "title": "Thay đĩa OSD hỏng", "tags": "ceph osd thay đĩa hỏng disk replace smart pveceph rebuild", "symptoms": "OSD down kéo dài, SMART báo lỗi hoặc dmesg có I/O error, cần thay đĩa vật lý.", "causes": "Đĩa hết tuổi thọ hoặc bad sector.", "steps": [{"t": "Xác định OSD hỏng và xác nhận đĩa lỗi", "cmds": ["ceph osd tree down", "ceph osd metadata <osd-id>", "smartctl -a /dev/<dev>"]}, {"t": "Đánh dấu out để dữ liệu được dựng lại trên các OSD khác, đợi các PG về active+clean", "cmds": ["ceph osd out <osd-id>", "ceph -w"]}, {"t": "Dừng OSD và kiểm tra an toàn trước khi xóa", "cmds": ["systemctl stop ceph-osd@<osd-id>", "ceph osd safe-to-destroy <osd-id>"]}, {"t": "Xóa OSD khỏi cluster (Proxmox)", "cmds": ["pveceph osd destroy <osd-id> --cleanup"]}, {"t": "Thay đĩa vật lý rồi tạo OSD mới, theo dõi backfill", "cmds": ["pveceph osd create /dev/<dev>", "ceph -s"]}], "notes": "Chỉ xóa OSD khi safe-to-destroy trả về an toàn. Thay từng đĩa một, đợi cluster về HEALTH_OK rồi mới thay đĩa tiếp theo."}, {"id": "node-maintenance", "title": "Bảo trì hoặc reboot một node Proxmox + Ceph", "tags": "reboot bảo trì node maintenance noout migrate nâng cấp kernel", "symptoms": "Cần reboot node để nâng cấp kernel hoặc thay phần cứng mà không làm gián đoạn VM và không kích hoạt rebalance.", "causes": "Khi node tắt, OSD của nó down; sau 10 phút Ceph tự out và bắt đầu rebalance không cần thiết nếu không đặt noout.", "steps": [{"t": "Kiểm tra cluster đang khỏe trước khi bắt đầu", "cmds": ["ceph -s", "pvecm status"]}, {"t": "Đặt noout để Ceph không tự rebalance", "cmds": ["ceph osd set noout"]}, {"t": "Di chuyển VM sang node khác", "cmds": ["pvenode migrateall <target-node>"]}, {"t": "Reboot, đợi node và OSD lên lại", "cmds": ["reboot", "pvecm status", "ceph osd stat"]}, {"t": "Khi các PG về active+clean thì gỡ noout", "cmds": ["ceph -s", "ceph osd unset noout"]}], "notes": "Mỗi lần chỉ làm một node. Đừng reboot node kế tiếp khi PG chưa active+clean. Quên unset noout là lỗi hay gặp: nếu sau đó một OSD chết thật, Ceph sẽ không tự phục hồi."}, {"id": "pg-degraded-recovery", "title": "PG degraded / undersized, recovery chậm", "tags": "ceph pg degraded undersized misplaced recovery chậm backfill thiếu replica", "symptoms": "HEALTH_WARN \"Degraded data redundancy\", \"N pgs undersized/degraded\", \"objects misplaced\", recovery chạy lâu.", "causes": "Mất OSD hoặc node, vừa thêm OSD mới, hoặc recovery bị giới hạn quá thấp.", "steps": [{"t": "Xem mức độ và OSD nào đang thiếu", "cmds": ["ceph health detail", "ceph pg stat", "ceph osd tree down"]}, {"t": "Tìm PG kẹt lâu và lý do", "cmds": ["ceph pg dump_stuck undersized", "ceph pg <pgid> query"]}, {"t": "Nếu muốn recovery nhanh hơn (chấp nhận ảnh hưởng client): ưu tiên PG quan trọng hoặc đổi profile", "cmds": ["ceph pg force-recovery <pgid>", "ceph config set osd osd_mclock_profile high_recovery_ops"]}, {"t": "Xong thì trả cấu hình về mặc định", "cmds": ["ceph config rm osd osd_mclock_profile"]}], "notes": "Trong lúc degraded, cluster có ít bản sao hơn bình thường, đừng bảo trì thêm node nào. Giờ cao điểm nên giữ profile ưu tiên client."}, {"id": "large-omap", "title": "Large omap objects (thường do bucket index RGW)", "tags": "ceph large omap objects rgw bucket index shard reshard cảnh báo", "symptoms": "HEALTH_WARN \"N large omap objects\".", "causes": "Bucket có quá nhiều object trên ít shard của index (hoặc omap lớn ở pool khác).", "steps": [{"t": "Xem pool và object bị cảnh báo", "cmds": ["ceph health detail"]}, {"t": "Tìm bucket vượt giới hạn shard", "cmds": ["radosgw-admin bucket limit check"]}, {"t": "Reshard bucket đó (nếu dynamic resharding chưa tự xử lý)", "cmds": ["radosgw-admin bucket reshard --bucket=<bucket> --num-shards=<n>"]}, {"t": "Cảnh báo chỉ hết sau khi deep-scrub PG chứa object cũ", "cmds": ["ceph pg deep-scrub <pgid>"]}], "notes": "Chọn số shard theo số object dự kiến (khoảng 100 nghìn object mỗi shard là mức tham khảo). Nếu pool khác RGW, tìm nguyên nhân omap ở ứng dụng đang dùng pool đó."}, {"id": "rgw-503", "title": "RGW/S3 trả 503 hoặc timeout, upload lỗi", "tags": "rgw s3 503 timeout upload lỗi radosgw không phản hồi bucket", "symptoms": "Client S3 nhận 503/timeout, upload thất bại, RGW phản hồi chậm.", "causes": "Daemon RGW treo hoặc crash, pool RGW đầy hoặc có slow ops, PG inactive trên pool index/data.", "steps": [{"t": "Cluster Ceph phía sau có ổn không", "cmds": ["ceph -s", "ceph health detail", "ceph df"]}, {"t": "Trạng thái và log daemon RGW", "cmds": ["systemctl status ceph-radosgw@rgw.<n>", "journalctl -u ceph-radosgw@rgw.<n> --since \"30 min ago\""]}, {"t": "Nếu lỗi theo một user hoặc bucket: xem quota và trạng thái", "cmds": ["radosgw-admin user info --uid=<uid>", "radosgw-admin bucket stats --bucket=<bucket>"]}, {"t": "Nếu chỉ RGW treo mà cluster ổn thì restart daemon", "cmds": ["systemctl restart ceph-radosgw@rgw.<n>"]}], "notes": "Hết quota thường trả 403 QuotaExceeded chứ không phải 503. Nếu có nhiều RGW sau load balancer, restart lần lượt từng cái để không mất dịch vụ."}, {"id": "mon-down", "title": "MON down, ceph -s treo hoặc mất quorum Ceph", "tags": "ceph mon down quorum mất quorum ceph -s treo monitor đầy disk", "symptoms": "ceph -s đứng treo hoặc báo \"1/3 mons down\", \"mon.X is down\".", "causes": "Daemon MON dừng, ổ chứa /var/lib/ceph đầy (MON store phình), lệch giờ, mạng giữa các MON.", "steps": [{"t": "Xem MON nào còn trong quorum (nếu ceph -s còn trả lời)", "cmds": ["ceph quorum_status -f json-pretty"]}, {"t": "Trên host MON: ceph -s treo thì hỏi thẳng qua admin socket", "cmds": ["ceph daemon mon.<id> mon_status"]}, {"t": "Kiểm tra service, log và dung lượng ổ", "cmds": ["systemctl status ceph-mon@<id>", "journalctl -u ceph-mon@<id> --since \"1 hour ago\"", "df -h /var/lib/ceph"]}, {"t": "Nếu store phình to thì compact, sau đó khởi động lại", "cmds": ["ceph tell mon.<id> compact", "systemctl restart ceph-mon@<id>"]}], "notes": "Cần đa số MON (2/3 hoặc 3/5) mới có quorum. Tuyệt đối không xóa thư mục store của MON khi chưa chắc còn đủ MON khác khỏe."}, {"id": "vm-locked", "title": "VM bị lock (backup/snapshot), không start hoặc migrate được", "tags": "proxmox vm lock locked backup snapshot unlock qm không start migrate treo", "symptoms": "Báo \"VM is locked (backup)\" hoặc \"(snapshot)\", không start, stop, migrate hoặc xóa được.", "causes": "Tác vụ backup hoặc snapshot bị ngắt giữa chừng (mất mạng, node reboot, task bị kill) và để lại khóa.", "steps": [{"t": "Xem VM đang bị khóa kiểu gì", "cmds": ["qm config <vmid>"]}, {"t": "Chắc chắn không còn backup hay restore đang chạy", "cmds": ["ps aux | grep -E \"vzdump|qmrestore\"", "pvesh get /nodes/<node>/tasks --limit 20"]}, {"t": "Mở khóa", "cmds": ["qm unlock <vmid>"]}, {"t": "Kiểm tra lại trạng thái VM và đĩa trước khi start", "cmds": ["qm status <vmid>", "qm config <vmid>"]}], "notes": "Chỉ unlock khi chắc không còn tiến trình nào đang dùng VM. Với container dùng pct unlock <ctid>. Sau backup bị ngắt nên kiểm tra snapshot rác trên VM."}, {"id": "pve-gui-logout", "title": "GUI Proxmox bị đăng xuất liên tục hoặc không đăng nhập được", "tags": "proxmox gui web logout đăng xuất session ticket pveproxy không đăng nhập lệch giờ", "symptoms": "GUI bị đá ra sau một thời gian ngắn, báo \"permission denied\" hoặc \"invalid ticket\", trang tải chậm hoặc treo.", "causes": "Giờ lệch giữa node và máy dùng trình duyệt (hoặc giữa các node) làm ticket không hợp lệ; pveproxy hoặc pvedaemon treo; cluster mất quorum.", "steps": [{"t": "So sánh giờ của node với giờ thực, và cả giờ máy đang dùng trình duyệt", "cmds": ["timedatectl", "chronyc tracking"]}, {"t": "Trạng thái các service giao diện và cluster", "cmds": ["systemctl status pveproxy pvedaemon pve-cluster", "pvecm status"]}, {"t": "Xem log pveproxy quanh thời điểm lỗi", "cmds": ["journalctl -u pveproxy --since \"1 hour ago\""]}, {"t": "Khởi động lại service giao diện (không ảnh hưởng VM đang chạy)", "cmds": ["systemctl restart pveproxy pvedaemon"]}], "notes": "Thử trình duyệt ẩn danh hoặc xóa cookie PVEAuthCookie để loại trừ lỗi phía client. Nếu truy cập qua reverse proxy hoặc VIP thì kiểm tra thêm giờ và timeout trên lớp đó."}, {"id": "pve-disk-full", "title": "Node Proxmox đầy ổ root, dịch vụ lỗi", "tags": "proxmox đầy ổ root disk full log journal /var/log no space left on device", "symptoms": "\"No space left on device\", dịch vụ không start, không ghi được /etc/pve, GUI lỗi.", "causes": "Log (journal, ceph) phình to, backup hoặc ISO nằm trên local, file tạm.", "steps": [{"t": "Xem ổ nào đầy", "cmds": ["df -h", "df -i"]}, {"t": "Tìm thư mục chiếm nhiều nhất", "cmds": ["du -xh / --max-depth=2 | sort -h | tail -20"]}, {"t": "Dọn log journal và cache apt", "cmds": ["journalctl --disk-usage", "journalctl --vacuum-size=500M", "apt clean"]}, {"t": "Kiểm tra ổ chứa backup và ISO", "cmds": ["pvesm status", "du -sh /var/lib/vz/*"]}], "notes": "Không xóa tay trong /var/lib/ceph hay /etc/pve. Log Ceph lớn thì kiểm tra logrotate. Đặt cảnh báo khi ổ root vượt khoảng 80%."}];
const $=s=>document.querySelector(s);
const N=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const map=$('#map'),wires=$('#wires'),root=$('#root'),q=$('#q');
let raf=0;
function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(paint)}
function paint(){
  if(getComputedStyle(wires).display==='none')return;
  const m=map.getBoundingClientRect(),r=root.getBoundingClientRect();
  wires.setAttribute('width',m.width);wires.setAttribute('height',m.height);
  const y1=r.top+r.height/2-m.top;let out='';
  document.querySelectorAll('.branch:not([hidden]) .bhead').forEach(btn=>{
    const side=btn.parentElement.dataset.side,h=btn.getBoundingClientRect();
    const x1=(side==='left'?r.left:r.right)-m.left,x2=(side==='left'?h.right:h.left)-m.left;
    const y2=h.top+h.height/2-m.top,cx=(x1+x2)/2;
    out+='<path class="w '+side+'" d="M'+x1+' '+y1+'C'+cx+' '+y1+' '+cx+' '+y2+' '+x2+' '+y2+'"/>';
  });
  wires.innerHTML=out;
}
function copy(el,text){
  if(!navigator.clipboard)return;
  navigator.clipboard.writeText(text).then(()=>{
    const old=el.textContent;el.textContent='Copied';
    setTimeout(()=>{el.textContent=old;draw()},700);
  },()=>{});
}
function setOpen(sec,open){
  const btn=sec.querySelector('.bhead'),body=sec.querySelector('.bbody');
  body.hidden=!open;btn.setAttribute('aria-expanded',String(open));
}
function build(side,branches,holder,title){
  const h=document.createElement('p');h.className='sidehead';h.textContent=title;holder.appendChild(h);
  branches.forEach(b=>{
    const n=b.subs.reduce((a,s)=>a+s.items.length,0);
    const sec=document.createElement('section');sec.className='branch '+side;sec.dataset.side=side;
    const btn=document.createElement('button');btn.type='button';btn.className='bhead';btn.setAttribute('aria-expanded','false');
    const id=document.createElement('span');id.className='bid';id.textContent=b.id;
    const nm=document.createElement('span');nm.className='bname';nm.textContent=b.name;
    const ct=document.createElement('span');ct.className='bcount';ct.textContent=n;
    btn.append(id,nm,ct);
    sec.id=b.id;
    const body=document.createElement('div');body.className='bbody';body.hidden=true;
    b.subs.forEach(s=>{
      const sub=document.createElement('div');sub.className='sub';
      const t=document.createElement('div');t.className='subname';t.textContent=s.name;sub.appendChild(t);
      const ul=document.createElement('ul');
      s.items.forEach(it=>{
        const li=document.createElement('li');if(it.d)li.className='danger';
        li.dataset.t=N(it.c+' '+it.p+' '+(it.v||'')+' '+(it.k||'')+' '+s.name+' '+b.name);
        const c=document.createElement('code');c.textContent=it.c;c.title='Click to copy';c.tabIndex=0;
        c.addEventListener('click',()=>copy(c,it.c));
        c.addEventListener('keydown',e=>{if(e.key==='Enter')copy(c,it.c)});
        const w=document.createElement('span');w.className='why';w.textContent=it.p;
        if(it.v){const vv=document.createElement('span');vv.className='vi';vv.textContent=it.v;li.append(c,vv,w)}else li.append(c,w);ul.appendChild(li);
      });
      sub.appendChild(ul);body.appendChild(sub);
    });
    btn.addEventListener('click',()=>{setOpen(sec,body.hidden);draw()});
    if(REPO&&SLUGS[b.id]){const a=document.createElement('a');a.className='gh';a.href='https://github.com/'+REPO+'/blob/main/docs/'+SLUGS[b.id];a.textContent='mở file .md';a.target='_blank';a.rel='noopener';body.prepend(a)}
    sec.append(btn,body);holder.appendChild(sec);
  });
}
build('left',DATA.left,$('#left'),'Proxmox host, '+DATA.left.length+' branches');
build('right',DATA.right,$('#right'),'Ceph, '+DATA.right.length+' branches');
$('#expand').addEventListener('click',()=>{document.querySelectorAll('.branch:not([hidden])').forEach(s=>setOpen(s,true));draw()});
$('#collapse').addEventListener('click',()=>{document.querySelectorAll('.branch').forEach(s=>setOpen(s,false));draw()});
q.addEventListener('input',()=>{
  const v=N(q.value.trim());renderResults(v);
  document.querySelectorAll('.branch').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('.sub').forEach(sub=>{
      let subAny=false;
      sub.querySelectorAll('li').forEach(li=>{const ok=!v||v.split(/\s+/).every(w=>li.dataset.t.includes(w));li.hidden=!ok;if(ok)subAny=true});
      sub.hidden=!subAny;if(subAny)any=true;
    });
    sec.hidden=!!v&&!any;
    setOpen(sec,!!v&&any);
  });
  draw();
});
window.addEventListener('resize',draw);
window.addEventListener('scroll',draw,{passive:true});
if(window.ResizeObserver)new ResizeObserver(draw).observe(map);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
const res=$('#results'),casesEl=$('#cases');
function mkPrompt(title,sym,cmds){return 'Tôi đang xử lý trên cluster Proxmox + Ceph: '+title+'\n'+(sym?'Triệu chứng: '+sym+'\n':'')+'Các lệnh chẩn đoán liên quan:\n'+cmds.map(c=>'- '+c).join('\n')+'\n\nOutput lệnh thực tế của tôi (đã xóa IP, tên host, key):\n<<< dán output vào đây >>>\n\nHãy phân tích nguyên nhân khả dĩ nhất, nói rõ còn thiếu thông tin gì, và đề xuất bước tiếp theo theo thứ tự an toàn nhất. Cảnh báo trước nếu có lệnh nguy hiểm.'}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function cmdEl(c){const e=el('code','cmdline',c);e.title='Bấm để copy';e.tabIndex=0;e.addEventListener('click',()=>copy(e,c));return e}
CASES.forEach(c=>{
  const d=el('details','case');d.id='case-'+c.id;d.dataset.t=N(c.title+' '+c.tags+' '+c.symptoms+' '+c.causes);
  d.append(el('summary',null,c.title));
  const p1=el('p');p1.append(el('b',null,'Triệu chứng: '),c.symptoms);
  const p2=el('p');p2.append(el('b',null,'Nguyên nhân hay gặp: '),c.causes);
  const ol=el('ol');
  c.steps.forEach(st=>{const li=el('li',null,st.t);st.cmds.forEach(x=>li.append(cmdEl(x)));ol.append(li)});
  const nt=el('p','note','Lưu ý: '+c.notes);
  const pb=el('button','pbtn','Copy prompt cho Claude');pb.type='button';
  pb.addEventListener('click',()=>copy(pb,mkPrompt(c.title,c.symptoms,c.steps.flatMap(s=>s.cmds))));
  d.append(p1,p2,ol,nt,pb);casesEl.append(d);
});
function show(tab){
  map.hidden=tab!=='map';casesEl.hidden=tab!=='cases';
  $('#tabmap').setAttribute('aria-pressed',String(tab==='map'));
  $('#tabcase').setAttribute('aria-pressed',String(tab==='cases'));
  $('#expand').hidden=$('#collapse').hidden=tab!=='map';
  if(tab==='map')draw();
}
$('#tabmap').addEventListener('click',()=>show('map'));
$('#tabcase').addEventListener('click',()=>show('cases'));
function renderResults(v){
  res.replaceChildren();
  casesEl.querySelectorAll('details.case').forEach(d=>{d.hidden=!!v&&!v.split(/\s+/).every(w=>d.dataset.t.includes(w))});
  if(!v){res.hidden=true;return}
  const toks=v.split(/\s+/),hits=[];
  [...DATA.left,...DATA.right].forEach(b=>b.subs.forEach(s=>s.items.forEach(it=>{
    const t=N(it.c+' '+it.p+' '+(it.v||'')+' '+(it.k||'')+' '+s.name+' '+b.name);
    if(toks.every(w=>t.includes(w)))hits.push({b,it});
  })));
  const ch=CASES.filter(c=>toks.every(w=>N(c.title+' '+c.tags+' '+c.symptoms+' '+c.causes).includes(w)));
  const head=el('div','rhead');
  head.append(el('span',null,'Kết quả: '+hits.length+' lệnh, '+ch.length+' case'));
  if(hits.length||ch.length){
    const pb=el('button','pbtn','Copy prompt cho Claude');pb.type='button';
    pb.addEventListener('click',()=>copy(pb,mkPrompt('"'+q.value.trim()+'"','',hits.slice(0,15).map(h=>h.it.c))));
    head.append(pb);
  }
  res.append(head);
  ch.forEach(c=>{const a=el('a','rcase','Case: '+c.title);a.href='#case-'+c.id;res.append(a)});
  hits.slice(0,30).forEach(({b,it})=>{
    const row=el('div','rrow');const a=el('a',null,b.id);a.href='#'+b.id;
    const box=el('div');box.append(cmdEl(it.c),el('span','vi',it.v||it.p));
    row.append(a,box);res.append(row);
  });
  if(hits.length>30)res.append(el('p','note','Còn '+(hits.length-30)+' lệnh nữa, thu hẹp từ khóa để xem.'));
  res.hidden=false;
}
['osd down','đầy disk','lệch giờ','mất quorum','slow ops','pg inconsistent','reboot bảo trì','thay đĩa','vm lock','đăng xuất','rgw 503','crash'].forEach(x=>{
  const b=el('button','chip',x);b.type='button';
  b.addEventListener('click',()=>{q.value=x;q.dispatchEvent(new Event('input'))});$('#chips').append(b)});
function openHash(){
  const id=decodeURIComponent(location.hash.slice(1));if(!id)return;
  if(id==='cases'){show('cases');return}
  if(id.startsWith('case-')){show('cases');const d=document.getElementById(id);if(d){d.hidden=false;d.open=true;d.scrollIntoView({block:'start'})}return}
  show('map');
  const sec=document.getElementById(id);if(!sec||!sec.classList.contains('branch'))return;
  setOpen(sec,true);draw();sec.scrollIntoView({block:'center'});
}
window.addEventListener('hashchange',openHash);
document.querySelectorAll('.branch').forEach(sec=>sec.querySelector('.bhead').addEventListener('click',()=>{
  if(!sec.querySelector('.bbody').hidden)history.replaceState(null,'','#'+sec.id)}));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();q.select()}
  if(e.key==='Escape'&&document.activeElement===q){q.value='';q.dispatchEvent(new Event('input'));q.blur()}
});
const qp=new URLSearchParams(location.search).get('q');
if(qp){q.value=qp;q.dispatchEvent(new Event('input'))}
q.placeholder='Lọc lệnh  (nhấn /)';
openHash();
draw();
</script>
</body>
</html>
