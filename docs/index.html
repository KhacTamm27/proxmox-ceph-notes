<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxmox + Ceph command mindmap</title>
<meta name="description" content="Cheatsheet lệnh Proxmox VE và Ceph, tìm theo từ khóa, mở thẳng từng mục qua #A1, #B13">
<style>
:root{--bg:#fbfbfa;--panel:#fff;--ink:#1c2330;--muted:#5d6877;--line:#d8dde4;--pve:#b4520a;--pve-soft:#fbeee2;--ceph:#0b6b86;--ceph-soft:#e6f3f7;--danger:#b3261e;--root:#1c2330;--rootink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1a2029;--ink:#e6e9ee;--muted:#9aa5b4;--line:#2c3542;--pve:#f0a061;--pve-soft:#2b2017;--ceph:#5cc0dc;--ceph-soft:#12262d;--danger:#ff8a80;--root:#e6e9ee;--rootink:#12161c}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:600;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input[type=search]{width:260px;max-width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.tools button{padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
:focus-visible{outline:2px solid var(--ceph);outline-offset:2px}
#map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);gap:0 16px;padding:20px;max-width:1500px;margin:0 auto}
#wires{position:absolute;left:0;top:0;pointer-events:none;z-index:0}
.w{fill:none;stroke-width:1.5;opacity:.55}
.w.left{stroke:var(--pve)}
.w.right{stroke:var(--ceph)}
.side{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.side.left{text-align:right}
.sidehead{font-size:13px;color:var(--muted);margin:0 0 4px}
.hub{position:relative;z-index:1}
.root{position:sticky;top:42vh;display:flex;align-items:center;justify-content:center;text-align:center;min-height:84px;padding:12px;border-radius:14px;background:var(--root);color:var(--rootink);font-weight:600;font-size:17px;line-height:1.25}
.branch{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.branch.left{border-right:4px solid var(--pve)}
.branch.right{border-left:4px solid var(--ceph)}
.bhead{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;background:transparent;text-align:inherit}
.branch.left .bhead{flex-direction:row-reverse}
.bid{font:600 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:2px 7px;border-radius:5px}
.left .bid{background:var(--pve-soft);color:var(--pve)}
.right .bid{background:var(--ceph-soft);color:var(--ceph)}
.bname{flex:1;font-weight:600}
.bcount{color:var(--muted);font-size:12.5px}
.bbody{padding:2px 14px 12px;border-top:1px solid var(--line)}
.subname{margin:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{padding:5px 0;border-bottom:1px dashed var(--line)}
li:last-child{border-bottom:0}
code{font:13px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;word-break:break-word;cursor:copy}
.why{display:block;color:var(--muted);font-size:12.5px}
li.danger code{color:var(--danger)}
[hidden]{display:none!important}
.gh{display:inline-block;margin:8px 0 0;font-size:12.5px;color:var(--ceph)}
.branch:target{box-shadow:0 0 0 2px var(--ceph)}
@media (max-width:860px){
.bsubs{display:none}
.bname{flex:1;max-width:none}
#map{grid-template-columns:1fr;padding:12px}
#wires{display:none}
.hub{order:-1;margin-bottom:8px}
.root{position:static;min-height:56px}
.side.left{text-align:left}
.branch.left{border-right:1px solid var(--line);border-left:4px solid var(--pve)}
.branch.left .bhead{flex-direction:row}
}

#map{display:block;max-width:1100px;padding:8px 20px 40px}
#wires,.hub{display:none}
.side{gap:6px;margin-bottom:22px}
.side.left,.side.right{text-align:left}
.sidehead{font-size:15px;font-weight:600;color:var(--ink);margin:14px 0 6px}
.branch.left,.branch.right{border:1px solid var(--line);border-left:4px solid var(--pve)}
.branch.right{border-left-color:var(--ceph)}
.branch.left .bhead{flex-direction:row}
.bhead{padding:10px 12px}
.bhead:hover{background:var(--panel-hover,rgba(127,127,127,.08))}
.bname{flex:0 0 280px;max-width:40%}
.bsubs{flex:1;min-width:0;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 28px}
.bbody .gh{grid-column:1/-1}
#jump b{font-size:12.5px;color:var(--muted);margin:0 2px 0 8px;align-self:center}
.jl{font:600 12px ui-monospace,Menlo,Consolas,monospace;padding:2px 7px;border:1px solid var(--line);border-radius:5px;text-decoration:none;color:var(--ink);background:var(--panel)}
.refs{font-size:13px;margin:6px 0}.refs a{color:var(--ceph)}
.tools .tab[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:10px 20px 0}
.chip{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13px;color:var(--muted)}
.vi{display:block;font-size:13px}
#results,.casesec{max-width:1100px;margin:0 auto;padding:12px 20px}
.sech{font-size:16px;margin:4px 0 10px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-weight:600}
.rrow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.rrow a{font:600 12px ui-monospace,Menlo,Consolas,monospace;text-decoration:none;color:var(--ceph)}
.rcase{display:block;padding:6px 0;color:var(--ceph)}
details.case{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:0 0 8px;padding:0 14px}
details.case summary{padding:10px 0;font-weight:600;cursor:pointer}
details.case ol{padding-left:20px;margin:6px 0}
details.case ol li{border:0;padding:4px 0}
.cmdline{display:block;margin:2px 0 6px}
.note{color:var(--muted);font-size:13px}
.pbtn{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px}
</style>
</head>
<body>
<header class="top">
<h1>Proxmox + Ceph command mindmap</h1>
<div class="tools">
<input id="q" type="search" placeholder="Filter commands" aria-label="Filter commands">
<button id="tabmap" class="tab" type="button" aria-pressed="true">Mindmap</button>
<button id="tabceph" class="tab" type="button" aria-pressed="false">Case Ceph</button>
<button id="tabpve" class="tab" type="button" aria-pressed="false">Case Proxmox</button>
<button id="tabrun" class="tab" type="button" aria-pressed="false">Runbook</button>
<button id="expand" type="button">Expand all</button>
<button id="collapse" type="button">Collapse all</button>
</div>
</header>
<div class="chips" id="chips" aria-label="Gợi ý tìm kiếm"></div>
<nav class="chips" id="jump" aria-label="Nhảy tới nhóm"></nav>
<section id="results" hidden></section>
<section id="cases-ceph" class="casesec" hidden><h2 class="sech">Case study Ceph</h2></section>
<section id="cases-run" class="casesec" hidden><h2 class="sech">Runbook (quy trình thao tác từng bước)</h2></section>
<section id="cases-pve" class="casesec" hidden><h2 class="sech">Case study Proxmox cluster</h2></section>
<main id="map">
<svg id="wires" aria-hidden="true"></svg>
<div class="side left" id="left"></div>
<div class="hub"><div class="root" id="root">Proxmox<br>+ Ceph</div></div>
<div class="side right" id="right"></div>
</main>

const REPO="KhacTamm27/proxmox-ceph-notes";const SLUGS={"A1": "proxmox/A01-system-and-node.md", "A2": "proxmox/A02-cluster-and-corosync.md", "A3": "proxmox/A03-virtual-machines-qm.md", "A4": "proxmox/A04-containers-pct-and-templates.md", "A5": "proxmox/A05-storage-pvesm.md", "A6": "proxmox/A06-backup-and-restore.md", "A7": "proxmox/A07-high-availability-and-replication.md", "A8": "proxmox/A08-network.md", "A9": "proxmox/A09-firewall.md", "A10": "proxmox/A10-disks-and-filesystems.md", "A11": "proxmox/A11-hardware-and-performance.md", "A12": "proxmox/A12-access-control-pveum.md", "A13": "proxmox/A13-tasks-logs-and-api.md", "A14": "proxmox/A14-ceph-management-from-proxmox-pveceph.md", "B1": "ceph/B01-health-and-status.md", "B2": "ceph/B02-mon.md", "B3": "ceph/B03-mgr-and-modules.md", "B4": "ceph/B04-osd-status.md", "B5": "ceph/B05-osd-flags-and-maintenance.md", "B6": "ceph/B06-osd-lifecycle-and-devices.md", "B7": "ceph/B07-osd-daemon-and-performance-admin-socket.md", "B8": "ceph/B08-crush-map.md", "B9": "ceph/B09-pools.md", "B10": "ceph/B10-placement-groups.md", "B11": "ceph/B11-recovery-scrub-and-config-tuning.md", "B12": "ceph/B12-rbd-vm-disks.md", "B13": "ceph/B13-rgw-and-s3-radosgw-admin.md", "B14": "ceph/B14-cephfs.md", "B15": "ceph/B15-authentication-cephx.md", "B16": "ceph/B16-benchmarks-and-low-level-rados.md", "B17": "ceph/B17-upgrade-and-compatibility.md", "B18": "ceph/B18-troubleshooting-shortlist.md"};const CASES=[{"id": "osd-down-flapping", "title": "OSD down hoặc up/down liên tục (flapping)", "tags": "ceph osd down flapping rớt osd heartbeat", "symptoms": "ceph -s báo \"N osds down\", OSD lúc up lúc down, log có \"wrongly marked me down\" hoặc heartbeat_check no reply.", "causes": "Tiến trình OSD crash, đĩa lỗi, host thiếu RAM (OOM killer), card mạng lỗi hoặc MTU không khớp làm mất heartbeat.", "steps": [{"t": "Xác định OSD nào đang down và ở host nào", "cmds": ["ceph health detail", "ceph osd tree down"]}, {"t": "Đọc log OSD quanh thời điểm rớt, tìm crash, I/O error, OOM", "cmds": ["journalctl -u ceph-osd@<osd-id> --since \"1 hour ago\"", "ceph crash ls"]}, {"t": "Trên host: kiểm tra OOM và lỗi đĩa", "cmds": ["dmesg -T | grep -Ei 'oom|i/o error|blk_update'", "smartctl -a /dev/<dev>"]}, {"t": "Nếu nghi mạng (nhiều OSD cùng host flap): xem lỗi NIC, MTU, heartbeat", "cmds": ["ethtool -S <if>", "ceph config get osd osd_heartbeat_grace"]}, {"t": "Nếu cần dừng OSD để xử lý: kiểm tra an toàn và đặt noout trước", "cmds": ["ceph osd ok-to-stop <osd-id>", "ceph osd set noout"]}, {"t": "Khởi động lại OSD, theo dõi nó vào lại, rồi gỡ noout", "cmds": ["systemctl restart ceph-osd@<osd-id>", "ceph osd stat", "ceph osd unset noout"]}], "notes": "Đĩa lỗi thật (SMART xấu, I/O error lặp lại) thì thay đĩa, đừng restart mãi. Đừng out nhiều OSD cùng lúc khi cluster đang không khỏe.", "scope": "ceph"}, {"id": "pg-inconsistent", "title": "PG inconsistent / scrub errors", "tags": "ceph pg inconsistent scrub error hỏng dữ liệu repair", "symptoms": "HEALTH_ERR, \"pg x.y is active+clean+inconsistent\", \"N scrub errors\".", "causes": "Một bản sao của object khác các bản còn lại (bad sector, lỗi đĩa, lỗi bộ nhớ) bị deep-scrub phát hiện.", "steps": [{"t": "Lấy ID PG bị lỗi", "cmds": ["ceph health detail"]}, {"t": "Xem object nào và bản sao nằm trên OSD nào bị lỗi", "cmds": ["rados list-inconsistent-obj <pgid> --format=json-pretty", "ceph pg map <pgid>"]}, {"t": "Kiểm tra sức khỏe đĩa của OSD chứa bản lỗi", "cmds": ["smartctl -a /dev/<dev>", "journalctl -u ceph-osd@<osd-id> --since \"1 hour ago\""]}, {"t": "Sửa PG rồi theo dõi cho đến khi hết cảnh báo", "cmds": ["ceph pg repair <pgid>", "ceph -w"]}], "notes": "Xác định bản lỗi trước khi repair. Nếu cùng một OSD báo lỗi lặp lại thì đĩa đang hỏng, nên thay đĩa thay vì repair liên tục.", "scope": "ceph"}, {"id": "clock-skew", "title": "Clock skew trên MON (lệch giờ)", "tags": "ceph clock skew lệch giờ mất đồng bộ giờ ntp chrony mon", "symptoms": "HEALTH_WARN \"clock skew detected on mon.X\", MON mất quorum chập chờn.", "causes": "Đồng hồ các node lệch quá ngưỡng (mặc định 0.05 giây), NTP/chrony không chạy hoặc không tới được nguồn giờ.", "steps": [{"t": "Xem MON nào lệch bao nhiêu", "cmds": ["ceph time-sync-status"]}, {"t": "Trên node lệch: kiểm tra chrony và nguồn giờ", "cmds": ["chronyc tracking", "chronyc sources -v", "timedatectl"]}, {"t": "Khởi động lại chrony và ép chỉnh giờ", "cmds": ["systemctl restart chrony", "chronyc makestep"]}, {"t": "Kiểm tra lại sau vài phút", "cmds": ["ceph time-sync-status", "ceph health detail"]}], "notes": "Đảm bảo mọi node cùng trỏ về cùng nguồn NTP nội bộ. Nếu là VM, tắt đồng bộ giờ trùng lặp từ hypervisor.", "scope": "ceph"}, {"id": "pve-quorum-lost", "title": "Cluster Proxmox mất quorum", "tags": "proxmox pve quorum mất quorum corosync cluster not ready read-only không start vm", "symptoms": "GUI báo \"cluster not ready - no quorum\", /etc/pve chuyển read-only, không start được VM, node hiện đỏ.", "causes": "Mất liên lạc giữa các node (mạng, switch, firewall chặn UDP 5405-5412), quá nửa số node tắt, hoặc cluster 2 node thiếu QDevice.", "steps": [{"t": "Xem số phiếu và node nào đang thấy nhau", "cmds": ["pvecm status", "pvecm nodes"]}, {"t": "Kiểm tra link corosync giữa các node", "cmds": ["corosync-cfgtool -s", "journalctl -u corosync -f"]}, {"t": "Kiểm tra mạng: ping giữa các node qua mạng cluster, MTU, firewall", "cmds": ["ping -M do -s 1472 <node-ip>"]}, {"t": "Khi mạng đã ổn, restart stack cluster", "cmds": ["systemctl restart pve-cluster corosync"]}, {"t": "Khẩn cấp (chỉ khi chắc chắn các node kia đã tắt hẳn): ép quorum tạm thời", "cmds": ["pvecm expected 1"]}], "notes": "pvecm expected 1 có nguy cơ split-brain nếu node kia thật ra vẫn chạy và ghi dữ liệu. Với cluster 2 node nên thêm QDevice. pmxcfs -l là biện pháp cuối cùng.", "scope": "pve"}, {"id": "nearfull-full", "title": "Ceph nearfull / full / pool đầy", "tags": "ceph nearfull full đầy disk dung lượng backfillfull osd đầy", "symptoms": "HEALTH_WARN \"N osd(s) nearfull\", HEALTH_ERR \"full osd(s)\", client không ghi được, backfill dừng.", "causes": "Dung lượng toàn cluster cạn, hoặc dữ liệu phân bố lệch làm một vài OSD đầy trước.", "steps": [{"t": "Xem dung lượng tổng và theo pool", "cmds": ["ceph df", "ceph health detail"]}, {"t": "Tìm OSD hoặc host đầy nhất, xem độ lệch", "cmds": ["ceph osd df tree", "ceph osd utilization"]}, {"t": "Nếu chỉ lệch: giảm tải OSD đầy", "cmds": ["ceph osd reweight-by-utilization", "ceph osd reweight <osd-id> 0.9"]}, {"t": "Giải phóng chỗ: xóa dữ liệu không cần hoặc thêm OSD, rồi theo dõi", "cmds": ["ceph -w"]}, {"t": "Khẩn cấp để mở ghi lại (chỉ tạm thời, trả về mặc định sau khi xử lý xong)", "cmds": ["ceph osd set-full-ratio 0.95"]}], "notes": "Không nâng ngưỡng full quá cao. Khi OSD chạm 100% có thể không khởi động được. Cluster nên giữ dưới khoảng 80% dung lượng.", "scope": "ceph"}, {"id": "slow-ops", "title": "Slow ops / blocked requests", "tags": "ceph slow ops blocked requests chậm treo latency io", "symptoms": "HEALTH_WARN \"N slow ops\", VM đơ hoặc IO chậm, \"requests are blocked\".", "causes": "Một OSD hoặc đĩa chậm, mạng nghẽn, recovery/scrub chiếm tải giờ cao điểm.", "steps": [{"t": "Xem OSD nào bị ảnh hưởng", "cmds": ["ceph health detail", "ceph osd perf"]}, {"t": "Trên host của OSD chậm: xem thao tác đang kẹt", "cmds": ["ceph daemon osd.<id> dump_ops_in_flight"]}, {"t": "Kiểm tra đĩa và mạng của host đó", "cmds": ["iostat -x 1", "ethtool -S <if>"]}, {"t": "Nếu recovery hoặc scrub đang chiếm tải: giảm tải và ưu tiên client", "cmds": ["ceph config set osd osd_max_backfills 1", "ceph config set osd osd_mclock_profile high_client_ops", "ceph osd set noscrub"]}], "notes": "Nhớ ceph osd unset noscrub sau khi xử lý xong. Một OSD có latency cao bất thường thường là đĩa sắp hỏng.", "scope": "ceph"}, {"id": "osd-replace-disk", "title": "Thay đĩa OSD hỏng", "tags": "ceph osd thay đĩa hỏng disk replace smart pveceph rebuild", "symptoms": "OSD down kéo dài, SMART báo lỗi hoặc dmesg có I/O error, cần thay đĩa vật lý.", "causes": "Đĩa hết tuổi thọ hoặc bad sector.", "steps": [{"t": "Xác định OSD hỏng và xác nhận đĩa lỗi", "cmds": ["ceph osd tree down", "ceph osd metadata <osd-id>", "smartctl -a /dev/<dev>"]}, {"t": "Đánh dấu out để dữ liệu được dựng lại trên các OSD khác, đợi các PG về active+clean", "cmds": ["ceph osd out <osd-id>", "ceph -w"]}, {"t": "Dừng OSD và kiểm tra an toàn trước khi xóa", "cmds": ["systemctl stop ceph-osd@<osd-id>", "ceph osd safe-to-destroy <osd-id>"]}, {"t": "Xóa OSD khỏi cluster (Proxmox)", "cmds": ["pveceph osd destroy <osd-id> --cleanup"]}, {"t": "Thay đĩa vật lý rồi tạo OSD mới, theo dõi backfill", "cmds": ["pveceph osd create /dev/<dev>", "ceph -s"]}], "notes": "Chỉ xóa OSD khi safe-to-destroy trả về an toàn. Thay từng đĩa một, đợi cluster về HEALTH_OK rồi mới thay đĩa tiếp theo.", "scope": "ceph"}, {"id": "node-maintenance", "title": "Bảo trì hoặc reboot một node Proxmox + Ceph", "tags": "reboot bảo trì node maintenance noout migrate nâng cấp kernel", "symptoms": "Cần reboot node để nâng cấp kernel hoặc thay phần cứng mà không làm gián đoạn VM và không kích hoạt rebalance.", "causes": "Khi node tắt, OSD của nó down; sau 10 phút Ceph tự out và bắt đầu rebalance không cần thiết nếu không đặt noout.", "steps": [{"t": "Kiểm tra cluster đang khỏe trước khi bắt đầu", "cmds": ["ceph -s", "pvecm status"]}, {"t": "Đặt noout để Ceph không tự rebalance", "cmds": ["ceph osd set noout"]}, {"t": "Di chuyển VM sang node khác", "cmds": ["pvenode migrateall <target-node>"]}, {"t": "Reboot, đợi node và OSD lên lại", "cmds": ["reboot", "pvecm status", "ceph osd stat"]}, {"t": "Khi các PG về active+clean thì gỡ noout", "cmds": ["ceph -s", "ceph osd unset noout"]}], "notes": "Mỗi lần chỉ làm một node. Đừng reboot node kế tiếp khi PG chưa active+clean. Quên unset noout là lỗi hay gặp: nếu sau đó một OSD chết thật, Ceph sẽ không tự phục hồi. Quy trình đầy đủ cho production (tắt HA, 6 cờ Ceph) xem runbook bảo trì production.", "scope": "pve"}, {"id": "pg-degraded-recovery", "title": "PG degraded / undersized, recovery chậm", "tags": "ceph pg degraded undersized misplaced recovery chậm backfill thiếu replica", "symptoms": "HEALTH_WARN \"Degraded data redundancy\", \"N pgs undersized/degraded\", \"objects misplaced\", recovery chạy lâu.", "causes": "Mất OSD hoặc node, vừa thêm OSD mới, hoặc recovery bị giới hạn quá thấp.", "steps": [{"t": "Xem mức độ và OSD nào đang thiếu", "cmds": ["ceph health detail", "ceph pg stat", "ceph osd tree down"]}, {"t": "Tìm PG kẹt lâu và lý do", "cmds": ["ceph pg dump_stuck undersized", "ceph pg <pgid> query"]}, {"t": "Nếu muốn recovery nhanh hơn (chấp nhận ảnh hưởng client): ưu tiên PG quan trọng hoặc đổi profile", "cmds": ["ceph pg force-recovery <pgid>", "ceph config set osd osd_mclock_profile high_recovery_ops"]}, {"t": "Xong thì trả cấu hình về mặc định", "cmds": ["ceph config rm osd osd_mclock_profile"]}], "notes": "Trong lúc degraded, cluster có ít bản sao hơn bình thường, đừng bảo trì thêm node nào. Giờ cao điểm nên giữ profile ưu tiên client.", "scope": "ceph"}, {"id": "large-omap", "title": "Large omap objects (thường do bucket index RGW)", "tags": "ceph large omap objects rgw bucket index shard reshard cảnh báo", "symptoms": "HEALTH_WARN \"N large omap objects\".", "causes": "Bucket có quá nhiều object trên ít shard của index (hoặc omap lớn ở pool khác).", "steps": [{"t": "Xem pool và object bị cảnh báo", "cmds": ["ceph health detail"]}, {"t": "Tìm bucket vượt giới hạn shard", "cmds": ["radosgw-admin bucket limit check"]}, {"t": "Reshard bucket đó (nếu dynamic resharding chưa tự xử lý)", "cmds": ["radosgw-admin bucket reshard --bucket=<bucket> --num-shards=<n>"]}, {"t": "Cảnh báo chỉ hết sau khi deep-scrub PG chứa object cũ", "cmds": ["ceph pg deep-scrub <pgid>"]}], "notes": "Chọn số shard theo số object dự kiến (khoảng 100 nghìn object mỗi shard là mức tham khảo). Nếu pool khác RGW, tìm nguyên nhân omap ở ứng dụng đang dùng pool đó.", "scope": "ceph"}, {"id": "rgw-503", "title": "RGW/S3 trả 503 hoặc timeout, upload lỗi", "tags": "rgw s3 503 timeout upload lỗi radosgw không phản hồi bucket", "symptoms": "Client S3 nhận 503/timeout, upload thất bại, RGW phản hồi chậm.", "causes": "Daemon RGW treo hoặc crash, pool RGW đầy hoặc có slow ops, PG inactive trên pool index/data.", "steps": [{"t": "Cluster Ceph phía sau có ổn không", "cmds": ["ceph -s", "ceph health detail", "ceph df"]}, {"t": "Trạng thái và log daemon RGW", "cmds": ["systemctl status ceph-radosgw@rgw.<n>", "journalctl -u ceph-radosgw@rgw.<n> --since \"30 min ago\""]}, {"t": "Nếu lỗi theo một user hoặc bucket: xem quota và trạng thái", "cmds": ["radosgw-admin user info --uid=<uid>", "radosgw-admin bucket stats --bucket=<bucket>"]}, {"t": "Nếu chỉ RGW treo mà cluster ổn thì restart daemon", "cmds": ["systemctl restart ceph-radosgw@rgw.<n>"]}], "notes": "Hết quota thường trả 403 QuotaExceeded chứ không phải 503. Nếu có nhiều RGW sau load balancer, restart lần lượt từng cái để không mất dịch vụ.", "scope": "ceph"}, {"id": "mon-down", "title": "MON down, ceph -s treo hoặc mất quorum Ceph", "tags": "ceph mon down quorum mất quorum ceph -s treo monitor đầy disk", "symptoms": "ceph -s đứng treo hoặc báo \"1/3 mons down\", \"mon.X is down\".", "causes": "Daemon MON dừng, ổ chứa /var/lib/ceph đầy (MON store phình), lệch giờ, mạng giữa các MON.", "steps": [{"t": "Xem MON nào còn trong quorum (nếu ceph -s còn trả lời)", "cmds": ["ceph quorum_status -f json-pretty"]}, {"t": "Trên host MON: ceph -s treo thì hỏi thẳng qua admin socket", "cmds": ["ceph daemon mon.<id> mon_status"]}, {"t": "Kiểm tra service, log và dung lượng ổ", "cmds": ["systemctl status ceph-mon@<id>", "journalctl -u ceph-mon@<id> --since \"1 hour ago\"", "df -h /var/lib/ceph"]}, {"t": "Nếu store phình to thì compact, sau đó khởi động lại", "cmds": ["ceph tell mon.<id> compact", "systemctl restart ceph-mon@<id>"]}], "notes": "Cần đa số MON (2/3 hoặc 3/5) mới có quorum. Tuyệt đối không xóa thư mục store của MON khi chưa chắc còn đủ MON khác khỏe.", "scope": "ceph"}, {"id": "vm-locked", "title": "VM bị lock (backup/snapshot), không start hoặc migrate được", "tags": "proxmox vm lock locked backup snapshot unlock qm không start migrate treo", "symptoms": "Báo \"VM is locked (backup)\" hoặc \"(snapshot)\", không start, stop, migrate hoặc xóa được.", "causes": "Tác vụ backup hoặc snapshot bị ngắt giữa chừng (mất mạng, node reboot, task bị kill) và để lại khóa.", "steps": [{"t": "Xem VM đang bị khóa kiểu gì", "cmds": ["qm config <vmid>"]}, {"t": "Chắc chắn không còn backup hay restore đang chạy", "cmds": ["ps aux | grep -E \"vzdump|qmrestore\"", "pvesh get /nodes/<node>/tasks --limit 20"]}, {"t": "Mở khóa", "cmds": ["qm unlock <vmid>"]}, {"t": "Kiểm tra lại trạng thái VM và đĩa trước khi start", "cmds": ["qm status <vmid>", "qm config <vmid>"]}], "notes": "Chỉ unlock khi chắc không còn tiến trình nào đang dùng VM. Với container dùng pct unlock <ctid>. Sau backup bị ngắt nên kiểm tra snapshot rác trên VM.", "scope": "pve"}, {"id": "pve-gui-logout", "title": "GUI Proxmox bị đăng xuất liên tục hoặc không đăng nhập được", "tags": "proxmox gui web logout đăng xuất session ticket pveproxy không đăng nhập lệch giờ", "symptoms": "GUI bị đá ra sau một thời gian ngắn, báo \"permission denied\" hoặc \"invalid ticket\", trang tải chậm hoặc treo.", "causes": "Giờ lệch giữa node và máy dùng trình duyệt (hoặc giữa các node) làm ticket không hợp lệ; pveproxy hoặc pvedaemon treo; cluster mất quorum.", "steps": [{"t": "So sánh giờ của node với giờ thực, và cả giờ máy đang dùng trình duyệt", "cmds": ["timedatectl", "chronyc tracking"]}, {"t": "Trạng thái các service giao diện và cluster", "cmds": ["systemctl status pveproxy pvedaemon pve-cluster", "pvecm status"]}, {"t": "Xem log pveproxy quanh thời điểm lỗi", "cmds": ["journalctl -u pveproxy --since \"1 hour ago\""]}, {"t": "Khởi động lại service giao diện (không ảnh hưởng VM đang chạy)", "cmds": ["systemctl restart pveproxy pvedaemon"]}], "notes": "Thử trình duyệt ẩn danh hoặc xóa cookie PVEAuthCookie để loại trừ lỗi phía client. Nếu truy cập qua reverse proxy hoặc VIP thì kiểm tra thêm giờ và timeout trên lớp đó.", "scope": "pve"}, {"id": "pve-disk-full", "title": "Node Proxmox đầy ổ root, dịch vụ lỗi", "tags": "proxmox đầy ổ root disk full log journal /var/log no space left on device", "symptoms": "\"No space left on device\", dịch vụ không start, không ghi được /etc/pve, GUI lỗi.", "causes": "Log (journal, ceph) phình to, backup hoặc ISO nằm trên local, file tạm.", "steps": [{"t": "Xem ổ nào đầy", "cmds": ["df -h", "df -i"]}, {"t": "Tìm thư mục chiếm nhiều nhất", "cmds": ["du -xh / --max-depth=2 | sort -h | tail -20"]}, {"t": "Dọn log journal và cache apt", "cmds": ["journalctl --disk-usage", "journalctl --vacuum-size=500M", "apt clean"]}, {"t": "Kiểm tra ổ chứa backup và ISO", "cmds": ["pvesm status", "du -sh /var/lib/vz/*"]}], "notes": "Không xóa tay trong /var/lib/ceph hay /etc/pve. Log Ceph lớn thì kiểm tra logrotate. Đặt cảnh báo khi ổ root vượt khoảng 80%.", "scope": "pve"}, {"id": "osd-wont-start", "scope": "ceph", "title": "OSD không lên sau reboot", "tags": "ceph osd không start sau reboot ceph-volume lvm activate không thấy đĩa failed", "symptoms": "Sau reboot một số OSD vẫn down, systemctl báo failed hoặc start-limit-hit.", "causes": "LVM chưa activate, đĩa đổi tên thiết bị hoặc không còn nhận, service chạm giới hạn số lần restart.", "steps": [{"t": "Xem OSD nào down và trạng thái service", "cmds": ["ceph osd tree down", "systemctl status ceph-osd@<osd-id>"]}, {"t": "Đọc log tìm lỗi mở đĩa hoặc bluestore", "cmds": ["journalctl -u ceph-osd@<osd-id> --since \"30 min ago\""]}, {"t": "Kiểm tra đĩa và LVM của OSD có còn không", "cmds": ["lsblk", "ceph-volume lvm list"]}, {"t": "Activate lại và start OSD", "cmds": ["ceph-volume lvm activate --all", "systemctl reset-failed ceph-osd@<osd-id>", "systemctl start ceph-osd@<osd-id>"]}], "notes": "Nếu lsblk không còn thấy đĩa thì là lỗi phần cứng, chuyển sang case thay đĩa OSD. Đừng dùng ceph-volume lvm create trên đĩa đang chứa OSD cũ vì sẽ xóa dữ liệu."}, {"id": "rbd-hang", "scope": "ceph", "title": "VM treo IO do image RBD (watcher, lock, blocklist)", "tags": "ceph rbd vm treo io lock watcher blocklist image không mở được", "symptoms": "VM đơ hoặc không start vì đĩa RBD, lỗi \"image is locked\", \"timeout\" khi mở image.", "causes": "Client cũ (node đã chết) còn giữ lock hoặc watcher, client bị blocklist, hoặc pool đang chậm.", "steps": [{"t": "Cluster và pool có ổn không", "cmds": ["ceph -s", "ceph health detail"]}, {"t": "Ai đang watch và lock image", "cmds": ["rbd status <pool>/<image>", "rbd lock ls <pool>/<image>"]}, {"t": "Client có bị blocklist không", "cmds": ["ceph osd blocklist ls"]}, {"t": "Nếu chủ lock là node đã chết hẳn thì chờ Ceph tự blocklist rồi start lại VM", "cmds": ["qm start <vmid>"]}], "notes": "Chỉ xóa lock thủ công (rbd lock rm) khi chắc chắn client giữ lock đã chết, nếu không có nguy cơ hai nơi cùng ghi một image."}, {"id": "deep-scrub-late", "scope": "ceph", "title": "Cảnh báo PG không được scrub / deep-scrub kịp thời", "tags": "ceph scrub deep-scrub not scrubbed in time noscrub quên gỡ cảnh báo pg", "symptoms": "HEALTH_WARN \"N pgs not deep-scrubbed in time\" hoặc \"not scrubbed in time\".", "causes": "Quên gỡ flag noscrub sau bảo trì, cửa sổ scrub quá hẹp, cluster bận hoặc số scrub đồng thời thấp.", "steps": [{"t": "Xem PG nào quá hạn", "cmds": ["ceph health detail"]}, {"t": "Kiểm tra có đang bị tắt scrub bằng flag không", "cmds": ["ceph osd dump"]}, {"t": "Xem cửa sổ scrub và cấu hình hiện tại", "cmds": ["ceph config get osd osd_scrub_begin_hour", "ceph config get osd osd_scrub_end_hour"]}, {"t": "Gỡ flag nếu có, rồi chạy deep-scrub thủ công cho PG quá hạn", "cmds": ["ceph osd unset noscrub", "ceph osd unset nodeep-scrub", "ceph pg deep-scrub <pgid>"]}], "notes": "Nguyên nhân phổ biến nhất là flag noscrub còn sót. Đừng chạy deep-scrub hàng loạt giờ cao điểm, scrub tốn IO đĩa."}, {"id": "pg-count", "scope": "ceph", "title": "Cảnh báo too many / too few PGs, chỉnh pg_num", "tags": "ceph pg number too many pgs per osd too few autoscale pg_num pool", "symptoms": "HEALTH_WARN \"too many PGs per OSD\" hoặc \"pool has too few/many pgs\".", "causes": "Số PG của pool không hợp với số OSD hiện có (thêm hoặc bớt OSD, tạo nhiều pool).", "steps": [{"t": "Xem autoscaler đề xuất gì cho từng pool", "cmds": ["ceph osd pool autoscale-status"]}, {"t": "Xem số PG trên mỗi OSD", "cmds": ["ceph osd df", "ceph health detail"]}, {"t": "Để autoscaler tự điều chỉnh (khuyến nghị)", "cmds": ["ceph osd pool set <pool> pg_autoscale_mode on"]}], "notes": "Đổi pg_num gây di chuyển dữ liệu, làm vào giờ thấp tải và theo dõi ceph -s. Khoảng 100 PG mỗi OSD là mức tham khảo."}, {"id": "network-mtu", "scope": "ceph", "title": "Mạng Ceph: MTU không khớp, nghẽn hoặc rớt gói", "tags": "ceph mạng network mtu jumbo rớt gói heartbeat slow ops osd flapping switch bond", "symptoms": "Slow ops hoặc OSD flapping chỉ liên quan một vài node, ping thường được nhưng IO lớn bị treo.", "causes": "MTU 9000 cấu hình không đồng nhất trên NIC, bridge, bond và switch; cổng switch lỗi; bond hash không đều.", "steps": [{"t": "Kiểm tra MTU thực sự thông suốt giữa hai node (jumbo 9000 thì dùng 8972)", "cmds": ["ping -M do -s 8972 <peer-ip>"]}, {"t": "Xem MTU và lỗi trên interface", "cmds": ["ip -s link show <if>", "ethtool -S <if>"]}, {"t": "Đo băng thông giữa hai node (cần cài iperf3)", "cmds": ["iperf3 -s", "iperf3 -c <peer-ip>"]}, {"t": "Đối chiếu OSD nào chậm", "cmds": ["ceph osd perf"]}], "notes": "MTU phải đồng nhất trên toàn đường đi: NIC, bond, bridge, VLAN và switch. Nếu ping -M do báo \"message too long\" thì có điểm nào đó MTU nhỏ hơn."}, {"id": "rgw-403", "scope": "ceph", "title": "RGW/S3 trả 403 (AccessDenied, SignatureDoesNotMatch, QuotaExceeded)", "tags": "rgw s3 403 access denied signature quota exceeded suspended key sai lệch giờ bucket policy", "symptoms": "Client S3 nhận 403 dù cluster khỏe: AccessDenied, SignatureDoesNotMatch hoặc QuotaExceeded.", "causes": "Sai access/secret key, user bị suspend, vượt quota, bucket policy hoặc ACL chặn, giờ client lệch quá nhiều so với server.", "steps": [{"t": "Xem key, trạng thái suspended và quota của user", "cmds": ["radosgw-admin user info --uid=<uid>"]}, {"t": "So dung lượng và số object của bucket với quota", "cmds": ["radosgw-admin bucket stats --bucket=<bucket>"]}, {"t": "Nếu vượt quota thì nâng hạn mức", "cmds": ["radosgw-admin quota set --quota-scope=user --uid=<uid> --max-size=<bytes> --max-objects=<n>"]}, {"t": "Kiểm tra giờ trên máy client và trên RGW (SignatureDoesNotMatch hay do lệch giờ)", "cmds": ["timedatectl"]}], "notes": "Sau khi đổi quota có thể cần radosgw-admin quota enable. Lỗi chỉ xảy ra với một bucket thì kiểm tra bucket policy và ACL."}, {"id": "add-osd-throttle", "scope": "ceph", "title": "Thêm OSD hoặc node mới làm chậm production", "tags": "ceph thêm osd node mới rebalance backfill chậm io client throttle mở rộng", "symptoms": "Sau khi thêm OSD hoặc node, VM chậm, nhiều PG backfilling, objects misplaced.", "causes": "Rebalance và backfill chiếm IO đĩa và mạng cùng lúc với tải client.", "steps": [{"t": "Theo dõi tiến độ rebalance", "cmds": ["ceph -s", "ceph pg stat"]}, {"t": "Giảm tải backfill và ưu tiên client", "cmds": ["ceph config set osd osd_max_backfills 1", "ceph config set osd osd_mclock_profile high_client_ops"]}, {"t": "Nếu cần tạm dừng hẳn trong giờ cao điểm, nhớ gỡ sau", "cmds": ["ceph osd set nobackfill", "ceph osd unset nobackfill"]}], "notes": "Nên thêm OSD từng chút một, ngoài giờ cao điểm. Khi muốn rebalance nhanh lại thì dùng profile high_recovery_ops hoặc xóa cấu hình đã đặt."}, {"id": "migrate-fail", "scope": "pve", "title": "Migrate VM thất bại", "tags": "proxmox migrate vm thất bại live migration lỗi local disk cpu cdrom iso storage", "symptoms": "Migrate báo lỗi, treo ở một phần trăm nào đó, hoặc không cho chọn node đích.", "causes": "Đĩa nằm trên local storage, ISO local gắn vào VM, storage không có ở node đích, khác thế hệ CPU với CPU type host, VM đang bị lock, mạng migrate chậm.", "steps": [{"t": "Xem log lỗi của tác vụ migrate", "cmds": ["pvesh get /nodes/<node>/tasks --limit 5"]}, {"t": "Kiểm tra cấu hình VM: đĩa local, cdrom, lock, passthrough", "cmds": ["qm config <vmid>"]}, {"t": "Node đích có đủ storage cần thiết không", "cmds": ["pvesm status", "pvecm status"]}, {"t": "Thử lại (đĩa local thì thêm tùy chọn kèm đĩa)", "cmds": ["qm migrate <vmid> <node> --online", "qm migrate <vmid> <node> --online --with-local-disks"]}], "notes": "Gỡ ISO khỏi cdrom trước khi migrate. VM dùng CPU type host giữa các node khác thế hệ có thể lỗi, nên dùng CPU type chung nếu cần live migrate linh hoạt."}, {"id": "vm-wont-start", "scope": "pve", "title": "VM không start được", "tags": "proxmox vm không start khởi động lỗi timeout quota storage không đủ ram qm start", "symptoms": "qm start báo lỗi, task lỗi, VM dừng ngay sau khi bật.", "causes": "Cluster mất quorum, storage chứa đĩa không available, thiếu RAM trên node, VM bị lock, file cấu hình trỏ tới đĩa hoặc thiết bị không tồn tại.", "steps": [{"t": "Chạy start để đọc thông báo lỗi chính xác", "cmds": ["qm start <vmid>"]}, {"t": "Kiểm tra lock và đường dẫn đĩa trong cấu hình", "cmds": ["qm config <vmid>"]}, {"t": "Storage và quorum có ổn không", "cmds": ["pvesm status", "pvecm status"]}, {"t": "Còn RAM trống không, và xem lệnh QEMU sẽ chạy", "cmds": ["free -h", "qm showcmd <vmid> --pretty"]}, {"t": "Xem log dịch vụ", "cmds": ["journalctl -u pvedaemon --since \"10 min ago\""]}], "notes": "Thấy \"no quorum\" thì xử lý theo case mất quorum trước. Thấy lock thì xem case VM bị lock."}, {"id": "pvestatd-unknown", "scope": "pve", "title": "Node hoặc VM hiện dấu hỏi (unknown), GUI không cập nhật", "tags": "proxmox unknown dấu hỏi pvestatd gui không cập nhật storage nfs treo node xám", "symptoms": "Trong GUI node, VM hoặc storage hiện dấu (?) xám, số liệu không cập nhật dù VM vẫn chạy.", "causes": "pvestatd bị treo, thường vì một storage từ xa (NFS, CIFS, PBS) không phản hồi.", "steps": [{"t": "Xem trạng thái pvestatd", "cmds": ["systemctl status pvestatd", "journalctl -u pvestatd --since \"30 min ago\""]}, {"t": "Tìm storage đang treo (dùng timeout để lệnh không bị kẹt)", "cmds": ["timeout 20 pvesm status"]}, {"t": "Restart pvestatd (không ảnh hưởng VM đang chạy)", "cmds": ["systemctl restart pvestatd"]}], "notes": "Nếu pvesm status hoặc df bị treo thì storage từ xa đang lỗi, xử lý mount hoặc mạng tới storage đó mới là gốc. Restart pvestatd chỉ là tạm thời."}, {"id": "ha-no-restart", "scope": "pve", "title": "HA: VM không tự chạy lại trên node khác, trạng thái error hoặc fence", "tags": "proxmox ha high availability fence error freeze node chết vm không tự chạy lại watchdog", "symptoms": "Node chết nhưng VM HA không tự khởi động ở node khác, hoặc VM HA ở trạng thái error, freeze, fence.", "causes": "Mất quorum, storage không dùng chung, watchdog không hoạt động, VM từng start lỗi nên HA đặt về error.", "steps": [{"t": "Xem HA đang nghĩ gì về từng VM và node", "cmds": ["ha-manager status", "ha-manager config"]}, {"t": "Xem log của LRM và CRM", "cmds": ["journalctl -u pve-ha-lrm -u pve-ha-crm --since \"1 hour ago\""]}, {"t": "Cluster còn quorum không, storage có chung không", "cmds": ["pvecm status", "pvesm status"]}, {"t": "Khi đã xử lý nguyên nhân, đưa VM khỏi trạng thái error: disable rồi start lại", "cmds": ["ha-manager set vm:<vmid> --state disabled", "ha-manager set vm:<vmid> --state started"]}], "notes": "HA cần quorum và đĩa VM nằm trên storage dùng chung (Ceph). Fence và chuyển VM mất vài phút sau khi node mất liên lạc, không phải tức thì."}, {"id": "backup-fail", "scope": "pve", "title": "Backup vzdump lỗi hoặc treo", "tags": "proxmox backup vzdump lỗi treo guest agent freeze storage đầy pbs lock", "symptoms": "Job backup báo lỗi, chạy rất lâu, hoặc để lại VM bị lock.", "causes": "Storage backup đầy hoặc mất kết nối, guest agent không phản hồi khi freeze, VM bị lock, hai job chồng nhau.", "steps": [{"t": "Storage đích còn chỗ và đang online không", "cmds": ["pvesm status", "df -h"]}, {"t": "Có tiến trình backup nào đang chạy hoặc treo", "cmds": ["ps aux | grep vzdump"]}, {"t": "Guest agent của VM có phản hồi không", "cmds": ["qm agent <vmid> ping"]}, {"t": "Nếu VM bị lock sau backup lỗi, mở khóa (chắc chắn không còn vzdump chạy)", "cmds": ["qm unlock <vmid>"]}, {"t": "Chạy thử thủ công một VM để thấy lỗi rõ", "cmds": ["vzdump <vmid> --storage <storage> --mode snapshot --compress zstd"]}], "notes": "Lỗi freeze thường do guest agent trong VM không chạy, cài hoặc bật qemu-guest-agent. Nên giãn lịch để các job backup không chồng nhau."}, {"id": "lvm-thin-full", "scope": "pve", "title": "local-lvm (thin pool) đầy", "tags": "proxmox lvm thin pool đầy local-lvm out of space metadata io error fstrim snapshot", "symptoms": "local-lvm gần 100%, VM bị I/O error hoặc treo, log có \"thin pool ... out of space\".", "causes": "Data hoặc metadata của thin pool đầy do snapshot tích tụ, đĩa cấp phát vượt dung lượng thật (overprovision).", "steps": [{"t": "Xem mức đầy của data và metadata", "cmds": ["pvesm status", "lvs -a"]}, {"t": "Tìm snapshot và đĩa chiếm nhiều chỗ", "cmds": ["lvs -o lv_name,lv_size,data_percent,metadata_percent"]}, {"t": "Giải phóng: xóa snapshot không cần (trong VM Linux chạy fstrim để trả block đã xóa)", "cmds": ["qm delsnapshot <vmid> <snapname>", "fstrim -av"]}, {"t": "Nếu VG còn trống thì mở rộng pool, nếu metadata đầy thì mở rộng metadata", "cmds": ["lvextend -L +<size> <vg>/data", "lvextend --poolmetadatasize +<size> <vg>/data"]}], "notes": "Pool đầy 100% có thể làm hỏng filesystem trong VM, nên đặt cảnh báo ở khoảng 80%. Cẩn thận khi overprovision."}, {"id": "pg-down-incomplete", "scope": "ceph", "title": "PG down, peering kẹt hoặc unfound objects (mất nhiều OSD)", "tags": "ceph pg down peering incomplete unfound objects mất dữ liệu osd lost mark_unfound_lost stuck inactive", "symptoms": "HEALTH_ERR, \"N pgs down\", pg ở trạng thái down+peering, IO vào một số object bị treo; hoặc \"N unfound\" (objects unfound).", "causes": "Nhiều OSD cùng chứa bản sao của một PG bị mất lần lượt (OSD thứ nhất chết, chưa kịp chép dữ liệu mới thì OSD thứ hai chết), peering bị chặn vì chờ OSD đã down.", "steps": [{"t": "Xem PG nào down và có phải do peering không", "cmds": ["ceph health detail", "ceph pg dump_stuck inactive"]}, {"t": "Hỏi PG vì sao kẹt: phần recovery_state sẽ nói peering đang bị chặn bởi OSD nào", "cmds": ["ceph pg <pgid> query"]}, {"t": "Cố gắng đưa OSD bị chặn sống lại trước (start service, sửa đĩa, đưa node về)", "cmds": ["ceph osd tree down", "systemctl start ceph-osd@<osd-id>"]}, {"t": "Với unfound: liệt kê object unfound và OSD có thể còn giữ bản sao", "cmds": ["ceph pg <pgid> list_unfound", "ceph pg <pgid> query"]}, {"t": "BIỆN PHÁP CUỐI, chỉ khi OSD chắc chắn không thể lấy lại: khai báo OSD mất rồi bỏ hoặc quay về bản cũ của object unfound (mất dữ liệu)", "cmds": ["ceph osd lost <osd-id> --yes-i-really-mean-it", "ceph pg <pgid> mark_unfound_lost revert"]}], "notes": "Hai lệnh ở bước cuối làm mất dữ liệu vĩnh viễn, tài liệu Ceph chỉ dùng khi đã hết cách lấy lại OSD. Chụp output của ceph pg query và ceph health detail trước khi chạy. Luôn ưu tiên đưa OSD cũ trở lại, kể cả đưa đĩa sang máy khác.", "refs": [{"t": "Ceph docs: Troubleshooting PGs", "u": "https://docs.ceph.com/en/reef/rados/troubleshooting/troubleshooting-pg/"}]}, {"id": "bluefs-spillover", "scope": "ceph", "title": "BLUEFS_SPILLOVER: metadata RocksDB tràn sang đĩa chậm", "tags": "ceph bluefs spillover db wal ssd nvme hdd metadata tràn rocksdb chậm cảnh báo bluestore", "symptoms": "HEALTH_WARN \"BlueFS spillover detected on N OSD(s)\", latency của các OSD HDD tăng.", "causes": "Phân vùng DB/WAL trên SSD/NVMe quá nhỏ so với dung lượng OSD (hoặc omap tăng nhiều, ví dụ bucket index RGW) nên metadata phải ghi xuống đĩa dữ liệu chậm.", "steps": [{"t": "Xem OSD nào bị và mức tràn", "cmds": ["ceph health detail"]}, {"t": "Đo lượng dữ liệu đang nằm trên đĩa chậm (slow_used_bytes lớn hơn 0 là đang tràn)", "cmds": ["ceph daemon osd.<osd-id> perf dump bluefs"]}, {"t": "Giảm tạm thời bằng compact (cảnh báo có thể quay lại)", "cmds": ["ceph tell osd.<osd-id> compact"]}, {"t": "Xử lý gốc: mở rộng thiết bị DB, hoặc dừng OSD rồi chuyển dữ liệu tràn về lại DB bằng công cụ bluestore", "cmds": ["systemctl stop ceph-osd@<osd-id>", "ceph-bluestore-tool bluefs-bdev-migrate --path /var/lib/ceph/osd/ceph-<osd-id> --devs-source /var/lib/ceph/osd/ceph-<osd-id>/block --dev-target /var/lib/ceph/osd/ceph-<osd-id>/block.db", "systemctl start ceph-osd@<osd-id>"]}], "notes": "Mức khuyến nghị tham khảo là DB khoảng 4% dung lượng OSD. Có thể tắt cảnh báo bằng ceph config set osd bluestore_warn_on_bluefs_spillover false nhưng đó chỉ là che cảnh báo, không giải quyết nguyên nhân. Làm lần lượt từng OSD, kiểm tra noout/ok-to-stop trước khi dừng.", "refs": [{"t": "Netdata: Ceph BlueStore DB spillover", "u": "https://www.netdata.cloud/guides/ceph/ceph-bluestore-db-spillover/"}, {"t": "Red Hat: BlueFS spillover warning", "u": "https://access.redhat.com/node/4820151"}]}, {"id": "cluster-full-emergency", "scope": "ceph", "title": "Cluster đầy khẩn cấp: ghi bị chặn (OSD_FULL), backfill_toofull", "tags": "ceph full osd_full cluster đầy không ghi được backfill_toofull recovery toofull đầy khẩn cấp gc snapshot", "symptoms": "HEALTH_ERR \"full osd(s)\", VM không ghi được, PG có backfill_toofull hoặc recovery_toofull nên recovery không chạy.", "causes": "Một hoặc vài OSD vượt ngưỡng full (mặc định 95%) do dữ liệu tăng nhanh hoặc phân bố lệch; Ceph chặn ghi để tránh hỏng dữ liệu. Snapshot và rác RGW chưa gc cũng giữ dung lượng.", "steps": [{"t": "Xác định OSD nào full và mức chung của cluster", "cmds": ["ceph health detail", "ceph df", "ceph osd df tree"]}, {"t": "Giải phóng chỗ trước: xóa snapshot, image RBD cũ, dữ liệu không quan trọng; nếu có RGW thì chạy gc", "cmds": ["radosgw-admin gc process"]}, {"t": "Chỉ khi không còn cách nào: tăng nhẹ ngưỡng full để mở lại ghi, đủ để xóa dữ liệu (nguy hiểm)", "cmds": ["ceph osd set-full-ratio 0.96"]}, {"t": "Khi đã thoát khỏi tình trạng đầy, trả về mặc định và rebalance", "cmds": ["ceph osd set-full-ratio 0.95", "ceph osd reweight-by-utilization"]}, {"t": "Dài hạn: thêm OSD hoặc node, theo dõi PG backfill", "cmds": ["ceph -s"]}], "notes": "Nâng ngưỡng full chỉ là mượn thêm vài phần trăm, OSD chạm 100% có thể không khởi động lại được. Cảnh báo theo OSD đầy nhất chứ không theo mức trung bình của cluster. Cluster nên giữ dưới khoảng 80% để còn chỗ cho recovery.", "refs": [{"t": "Ceph docs: Health checks", "u": "https://docs.ceph.com/en/mimic/rados/operations/health-checks"}, {"t": "Netdata: Ceph OSD_FULL", "u": "https://www.netdata.cloud/guides/ceph/ceph-osd-full/"}, {"t": "Netdata: backfill_toofull", "u": "https://www.netdata.cloud/guides/ceph/ceph-backfill-toofull/"}]}, {"id": "osd-latency-consumer-ssd", "scope": "ceph", "title": "Latency OSD cao, IOPS thấp do SSD consumer (không có PLP)", "tags": "ceph latency cao iops thấp ssd consumer plp power loss protection nvme enterprise commit latency chậm vm", "symptoms": "ceph osd perf cho commit/apply latency hàng chục đến hàng trăm ms ở một số OSD, VM chậm, thỉnh thoảng slow ops, benchmark cho IOPS rất thấp.", "causes": "Ceph ghi đồng bộ (sync write). SSD consumer không có bảo vệ mất điện (PLP) không cache được ghi đồng bộ nên latency rất cao và tụt mạnh khi tải liên tục.", "steps": [{"t": "So sánh latency giữa các OSD, tìm OSD tệ nhất", "cmds": ["ceph osd perf"]}, {"t": "Chạy benchmark ngắn trên OSD nghi ngờ (cẩn thận giờ cao điểm)", "cmds": ["ceph tell osd.<osd-id> bench"]}, {"t": "Kiểm tra model đĩa và SMART", "cmds": ["lsblk -d -o NAME,MODEL,SIZE", "smartctl -a /dev/<dev>"]}, {"t": "Loại trừ nguyên nhân khác: mạng và recovery đang chạy", "cmds": ["ethtool -S <if>", "ceph -s"]}], "notes": "Cộng đồng Proxmox khuyến nghị SSD enterprise có PLP cho Ceph, giải pháp thật sự thường là thay đĩa. Đừng mua đĩa thay thế trước khi so sánh latency giữa các OSD cùng loại để chắc là đĩa chứ không phải mạng.", "refs": [{"t": "Proxmox forum: Ceph low performance", "u": "https://forum.proxmox.com/threads/ceph-low-performance.183462/"}, {"t": "Proxmox forum: High latency on Proxmox Ceph cluster", "u": "https://forum.proxmox.com/threads/high-latency-on-proxmox-ceph-cluster.181091/"}]}, {"id": "ceph-upgrade-pve", "scope": "ceph", "title": "Nâng cấp Ceph trên Proxmox (ví dụ Reef lên Squid)", "tags": "ceph upgrade nâng cấp reef squid quincy mon mgr osd require-osd-release noout proxmox ceph.list repository", "symptoms": "Cần nâng cấp phiên bản Ceph mà không làm gián đoạn VM; sau nâng cấp có cảnh báo require-osd-release.", "causes": "Nâng cấp Ceph phải đi đúng thứ tự: MON rồi MGR rồi OSD, và phải chốt require-osd-release sau cùng.", "steps": [{"t": "Trước khi bắt đầu: cluster phải HEALTH_OK, biết phiên bản hiện tại", "cmds": ["ceph -s", "ceph versions"]}, {"t": "Đặt noout cho cả quá trình", "cmds": ["ceph osd set noout"]}, {"t": "Đổi repository Ceph sang bản mới (theo hướng dẫn chính thức) rồi nâng cấp gói trên từng node", "cmds": ["sed -i \"s/reef/squid/\" /etc/apt/sources.list.d/ceph.list", "apt update", "apt full-upgrade"]}, {"t": "Restart theo thứ tự, từng node một: MON trước, kiểm tra min_mon_release", "cmds": ["systemctl restart ceph-mon.target", "ceph mon dump | grep min_mon_release"]}, {"t": "Tiếp theo MGR, kiểm tra các mgr chạy", "cmds": ["systemctl restart ceph-mgr.target", "ceph -s"]}, {"t": "Cuối cùng OSD, từng node một, chờ PG active+clean giữa các node", "cmds": ["systemctl restart ceph-osd.target", "ceph osd stat"]}, {"t": "Chốt phiên bản và gỡ noout", "cmds": ["ceph osd require-osd-release squid", "ceph osd unset noout"]}], "notes": "Không bỏ qua phiên bản trung gian (Proxmox khuyến nghị lên Reef trước khi lên Squid). Đảm bảo không còn OSD kiểu FileStore. Quên ceph osd unset noout là lỗi hay gặp. Luôn đọc trang hướng dẫn nâng cấp tương ứng trên pve.proxmox.com vì từng phiên bản có lưu ý riêng.", "refs": [{"t": "Proxmox wiki: Ceph Reef to Squid", "u": "https://pve.proxmox.com/wiki/Ceph_Reef_to_Squid"}, {"t": "Proxmox wiki: Ceph Quincy to Reef", "u": "https://pve.proxmox.com/wiki/Ceph_Quincy_to_Reef"}]}, {"id": "corosync-flapping", "scope": "pve", "title": "Corosync link chập chờn, retransmit, node tự reboot (HA watchdog)", "tags": "proxmox corosync flapping retransmit knet link down token cluster reboot watchdog fence mất quorum bond lacp mạng cluster riêng", "symptoms": "Log corosync có \"Retransmit List\", knet link down/up, \"Token has not been received\"; cluster mất quorum rồi phục hồi; các node có HA tự reboot cùng lúc.", "causes": "Mạng corosync bị trễ hoặc rớt gói: dùng chung đường với lưu lượng Ceph/backup/replication, đặt link corosync trên bond (failover của bond cộng với phục hồi link của corosync), MTU lệch hoặc switch lỗi.", "steps": [{"t": "Xem log corosync quanh thời điểm lỗi", "cmds": ["journalctl -u corosync --since \"1 hour ago\""]}, {"t": "Trạng thái link hiện tại và quorum", "cmds": ["corosync-cfgtool -s", "pvecm status"]}, {"t": "Xác nhận corosync thật sự đang đi qua đường mạng riêng đã dự định, và đường đó thông MTU", "cmds": ["cat /etc/pve/corosync.conf", "ping -M do -s 1472 <node-ip>"]}, {"t": "Kiểm tra lỗi NIC và cổng switch", "cmds": ["ip -s link show <if>", "ethtool -S <if>"]}], "notes": "Hướng dẫn từ cộng đồng và nhân viên Proxmox: dùng NIC vật lý riêng cho corosync (1G đủ vì độ trễ mới là yếu tố quan trọng), thêm link thứ hai (link1) để dự phòng thay vì dùng bond cho corosync, và không để Ceph, backup, replication chiếm đường corosync. Sửa corosync.conf cần theo đúng quy trình trong tài liệu Cluster Manager (sửa bản .new và tăng config_version). Node có HA reboot khi mất quorum là hành vi thiết kế của watchdog.", "refs": [{"t": "Proxmox forum: Retransmit list, cả HA cluster reboot", "u": "https://forum.proxmox.com/threads/totem-retransmit-list-causing-entire-ha-cluster-to-reboot-unexpectedly.167112/"}, {"t": "Proxmox forum: Nodes constantly fencing", "u": "https://forum.proxmox.com/goto/post?id=776001"}]}, {"id": "ghost-node-rejoin", "scope": "pve", "title": "Xóa node hỏng và join lại cùng tên (node ma xám trong GUI)", "tags": "proxmox xóa node delnode node ma xám gui join lại cùng tên hostname reinstall updatecerts /etc/pve/nodes known_hosts", "symptoms": "Đã pvecm delnode nhưng node vẫn hiện xám trong GUI; cài lại node cùng tên không join được hoặc báo lỗi SSH/chứng chỉ.", "causes": "Cluster giữ lại thư mục cấu hình của node đã xóa trong /etc/pve/nodes; chứng chỉ và khóa SSH cũ trùng tên.", "steps": [{"t": "Xác nhận node đã thật sự bị gỡ khỏi cluster (và máy cũ đã tắt hẳn)", "cmds": ["pvecm status", "pvecm nodes"]}, {"t": "Nếu chưa gỡ, chạy từ một node còn sống", "cmds": ["pvecm delnode <node>"]}, {"t": "Xem thư mục còn sót của node, rồi xóa ĐÚNG thư mục của node đã gỡ (xóa nhầm tên là hỏng cluster)", "cmds": ["ls /etc/pve/nodes", "rm -rf /etc/pve/nodes/<OLD-NODE-NAME>"]}, {"t": "Cài lại node mới sạch hoàn toàn rồi join, sau đó cập nhật chứng chỉ vì dùng lại tên cũ", "cmds": ["pvecm add <existing-node-ip>", "pvecm updatecerts"]}, {"t": "Nếu cụm có Ceph, kiểm tra cấu hình còn nhắc IP của node cũ không", "cmds": ["cat /etc/pve/ceph.conf"]}], "notes": "Node đã gỡ không được bật lại với cấu hình cũ. Chỉ nên join lại cùng tên khi node đã được cài lại từ đầu hoặc là máy hoàn toàn mới. Nếu node đó có MON hoặc OSD Ceph thì gỡ chúng khỏi Ceph đúng cách trước khi xóa node.", "refs": [{"t": "Proxmox forum: Older node was re-installed and wants to join", "u": "https://forum.proxmox.com/goto/post?id=427504"}, {"t": "Proxmox forum: Remove node from cluster", "u": "https://forum.proxmox.com/goto/post?id=640499"}]}, {"id": "cfs-lock-timeout", "scope": "pve", "title": "Lỗi cfs-lock \"got lock request timeout\" (pmxcfs, HA, replication)", "tags": "proxmox cfs-lock got lock request timeout pmxcfs pve-cluster /etc/pve ha replication pvescheduler authkey lỗi lock cluster", "symptoms": "Log có \"cfs-lock ... error: got lock request timeout\" (từ pvescheduler, pvestatd, ha-crm), tác vụ HA/replication/backup lỗi, GUI báo unknown.", "causes": "Hệ thống file cụm (pmxcfs) không xin được khóa: thường là triệu chứng của cluster mất đồng bộ, corosync/mạng có vấn đề, hoặc pmxcfs trên một node bị treo.", "steps": [{"t": "Quorum và corosync có ổn không (đây là gốc phổ biến nhất)", "cmds": ["pvecm status", "corosync-cfgtool -s"]}, {"t": "Trạng thái và log của pve-cluster", "cmds": ["systemctl status pve-cluster corosync", "journalctl -u pve-cluster -u pvescheduler --since \"1 hour ago\""]}, {"t": "Thử ghi vào /etc/pve để biết pmxcfs có phản hồi không", "cmds": ["touch /etc/pve/.writetest", "rm /etc/pve/.writetest"]}, {"t": "Nếu pmxcfs treo trên một node, restart dịch vụ cụm node đó (từng node một)", "cmds": ["systemctl restart pve-cluster"]}], "notes": "Có người xóa thủ công thư mục khóa trong /etc/pve/priv/lock để hết lỗi nhưng chỉ tạm thời, lỗi tái phát vì nguyên nhân gốc (cluster hoặc mạng) vẫn còn. Chỉ xóa khóa khi hiểu rõ khóa nào và chắc không còn tiến trình nào đang giữ.", "refs": [{"t": "Proxmox forum: cfs lock domain-ha timeout", "u": "https://forum.proxmox.com/threads/cfs-lock-domain-ha-timeout-master-old-timestamp.48347/latest"}, {"t": "Proxmox forum: cluster 3 node status unknown, cfs-lock", "u": "https://forum.proxmox.com/threads/cluster-of-3-nodes-with-status-unknown-only-if-2-specific-nodes-are-online.164399/"}]}, {"id": "pve-upgrade-8to9", "scope": "pve", "title": "Nâng cấp Proxmox VE 8 lên 9 trong cluster có Ceph", "tags": "proxmox nâng cấp upgrade pve 8 9 pve8to9 debian trixie ceph squid cluster full-upgrade reboot", "symptoms": "Cần nâng cấp cluster Proxmox đang chạy production (có Ceph, HA) mà không gián đoạn dịch vụ.", "causes": "Nâng cấp bản chính có thứ tự bắt buộc và phải làm từng node, nếu sai thứ tự có thể kẹt gói hoặc mất tính tương thích với Ceph.", "steps": [{"t": "Chạy bộ kiểm tra trước nâng cấp trên mọi node và sửa hết cảnh báo", "cmds": ["pve8to9 --full"]}, {"t": "Lưu lại trạng thái trước khi làm (cluster, Ceph)", "cmds": ["pvecm status", "ceph -s", "ceph osd tree"]}, {"t": "Đưa Ceph lên bản yêu cầu (Squid) trước, theo case nâng cấp Ceph", "cmds": ["ceph versions"]}, {"t": "Từng node một: di chuyển VM đi, nâng cấp gói, reboot", "cmds": ["pvenode migrateall <target-node>", "apt update", "apt full-upgrade"]}, {"t": "Sau mỗi node kiểm tra rồi mới làm node kế tiếp", "cmds": ["pveversion -v", "pvecm status", "ceph -s"]}], "notes": "Làm theo trang hướng dẫn nâng cấp chính thức của Proxmox (có lưu ý riêng từng phiên bản), bài này chỉ là bộ khung kiểm tra. Nên có backup đầy đủ, và migrate VM từ node mới về node cũ chưa chắc được nên làm theo hướng cũ sang mới. Thực hiện ngoài giờ cao điểm.", "refs": [{"t": "Proxmox wiki: Ceph Reef to Squid", "u": "https://pve.proxmox.com/wiki/Ceph_Reef_to_Squid"}, {"t": "WZ-IT: Proxmox VE 8 to 9 upgrade guide", "u": "https://wz-it.com/en/blog/proxmox-ve-8-to-9-upgrade-guide-enterprise/"}]}, {"id": "node-dead-recovery", "scope": "pve", "title": "Một node chết hẳn (hỏng phần cứng): khôi phục dịch vụ", "tags": "proxmox node chết hỏng phần cứng khôi phục vm không ha move config qemu-server ceph degraded mất node", "symptoms": "Một node mất hoàn toàn (không bật lại được), VM trên node đó ngừng, GUI hiện node đỏ, Ceph báo OSD down và PG degraded.", "causes": "Hỏng phần cứng, nguồn, mainboard. Cluster còn quorum nhưng cần đưa dịch vụ lên node khác.", "steps": [{"t": "Xác nhận node thật sự chết (không chỉ đứt mạng) và cluster còn quorum", "cmds": ["pvecm status"]}, {"t": "Tình trạng Ceph: cluster sẽ degraded nhưng vẫn phục vụ nếu còn đủ bản sao", "cmds": ["ceph -s", "ceph osd tree down"]}, {"t": "VM có HA sẽ tự chạy lại sau khi fence, xem trạng thái", "cmds": ["ha-manager status"]}, {"t": "VM không HA mà đĩa nằm trên Ceph: chuyển file cấu hình sang node còn sống rồi start (CHỈ khi chắc node chết đã tắt hẳn)", "cmds": ["mv /etc/pve/nodes/<dead-node>/qemu-server/<vmid>.conf /etc/pve/nodes/<alive-node>/qemu-server/", "qm start <vmid>"]}, {"t": "Nếu thay thế node sẽ lâu, để Ceph tự recover; nếu sắp đưa lại trong thời gian ngắn, đặt noout để tránh rebalance", "cmds": ["ceph osd set noout"]}], "notes": "Không bao giờ chạy cùng một VM ở hai node: hai bản cùng ghi vào một đĩa sẽ hỏng dữ liệu. Tắt hẳn node chết (rút nguồn, IPMI power off) trước khi chuyển cấu hình. Sau khi node mới vào lại, theo case xóa node hỏng và join lại cùng tên."}, {"id": "maintenance-flags-left", "scope": "ceph", "title": "Cờ bảo trì Ceph còn sót sau bảo trì (noout, noscrub, norecover...)", "tags": "ceph flags còn sót quên gỡ noout nobackfill norecover norebalance noscrub nodeep-scrub health warn flag(s) set unset bảo trì", "symptoms": "HEALTH_WARN \"noout,nobackfill,norecover,norebalance,noscrub,nodeep-scrub flag(s) set\", PG không recover, cảnh báo scrub quá hạn.", "causes": "Quên bỏ các cờ đã đặt trước khi bảo trì hoặc nâng cấp. Khi còn noout, OSD chết thật cũng không được out để recover, còn norecover và nobackfill làm dữ liệu giữ trạng thái degraded.", "steps": [{"t": "Xem cờ nào đang bật (cũng thấy ở GUI: Ceph, OSD, Manage Global Flags)", "cmds": ["ceph health detail", "ceph osd dump | grep flags"]}, {"t": "Bỏ từng cờ khi bảo trì đã xong và cluster đã ổn", "cmds": ["ceph osd unset noout", "ceph osd unset nobackfill", "ceph osd unset norecover", "ceph osd unset norebalance", "ceph osd unset noscrub", "ceph osd unset nodeep-scrub"]}, {"t": "Theo dõi recovery và scrub chạy lại", "cmds": ["ceph -s", "ceph -w"]}], "notes": "Nên chỉ bỏ cờ khi đã chắc mọi OSD up/in. Bỏ cờ xong recovery và backfill sẽ chạy dồn nên có thể ảnh hưởng IO, tham khảo case thêm OSD làm chậm production để giảm tải. Ghi checklist đặt cờ và bỏ cờ vào quy trình bảo trì."}, {"id": "ha-domino", "scope": "pve", "title": "Node dừng: HA khởi động lại đồng loạt VM làm tràn RAM (domino)", "tags": "proxmox ha fencing domino tràn ram overload vm đồng loạt khởi động node dead sập hệ thống ha-manager tắt ha trước khi bảo trì", "symptoms": "Một node dừng hoặc bị fence, VM của nó tự bật lại trên các host còn lại, RAM các host đầy, hệ thống chậm hoặc sập lan sang node khác.", "causes": "Cơ chế fencing đánh dấu node dead rồi migrate hoặc khởi động lại VM trên host khác. VM đang dừng không dùng tài nguyên, nhưng khi nhiều VM bật đồng loạt thì RAM bị chiếm ngay, các host còn lại không đủ chỗ.", "steps": [{"t": "Xem HA đang làm gì và VM nào đang bật lại", "cmds": ["ha-manager status", "ha-manager config"]}, {"t": "Kiểm tra RAM trên các host còn lại", "cmds": ["free -h", "pvesh get /nodes/<node>/status"]}, {"t": "Trước bảo trì có kế hoạch: tắt HA theo thứ tự (pve-ha-lrm ở mọi host trước, rồi pve-ha-crm), xem runbook bảo trì production", "cmds": ["systemctl stop pve-ha-lrm", "systemctl stop pve-ha-crm"]}], "notes": "Phòng ngừa tốt nhất là tính dự phòng RAM kiểu N+1 (các node còn lại gánh được VM của node lớn nhất) và không bảo trì khi HA đang bật. Không dừng pve-ha-lrm và pve-ha-crm đồng loạt."}, {"id": "cephfs-mds-restart", "scope": "ceph", "title": "CephFS: MDS failover khi restart hoặc nâng cấp (max_mds lớn hơn 1)", "tags": "ceph cephfs mds failover restart nâng cấp max_mds standby active rank ceph fs status", "symptoms": "Restart ceph-mds.target hoặc nâng cấp làm CephFS gián đoạn ngắn, trạng thái MDS tạm là replay, reconnect hoặc rejoin.", "causes": "Node đang giữ rank active của CephFS sẽ failover sang standby khi MDS restart. Gián đoạn ngắn là bình thường. Với max_mds lớn hơn 1 (nhiều rank active) cần cẩn thận hơn.", "steps": [{"t": "Trước khi làm: ghi lại rank nào active ở node nào để dự đoán failover", "cmds": ["ceph fs status"]}, {"t": "Quy trình cẩn trọng cho MDS (theo ghi chú nâng cấp): đặt max_mds = 1, dừng hết MDS standby", "cmds": ["ceph fs set <fsname> max_mds 1", "systemctl stop ceph-mds@<standby-id>"]}, {"t": "Nâng cấp hoặc restart MDS active, kiểm tra CephFS truy cập bình thường", "cmds": ["systemctl restart ceph-mds@<active-id>", "ceph fs status"]}, {"t": "Bật lại các standby và trả max_mds về giá trị cũ", "cmds": ["systemctl start ceph-mds@<standby-id>", "ceph fs set <fsname> max_mds 2"]}], "notes": "Nếu vận hành giữ nguyên max_mds = 2 trong nâng cấp (như ghi chú gốc), vẫn chấp nhận failover ngắn khi restart từng node nhưng phải kiểm tra ceph -s và ceph fs status sau mỗi lần restart. Làm từng node một."}, {"id": "pbs-s3-recovery", "scope": "pve", "title": "PBS hỏng hoặc tắt: dựng PBS mới nhận lại Datastore S3 (adopt) và restore", "tags": "proxmox pbs backup server hỏng cháy tắt dựng lại s3 datastore adopt overwrite in-use marker restore vm cache mã hóa key encryption", "symptoms": "Máy PBS cũ lỗi phần cứng, cháy, hoặc chủ động tắt, cần khôi phục dữ liệu backup đang nằm trên bucket S3.", "causes": "Dữ liệu backup nằm trên S3 nên còn nguyên, chỉ mất lớp quản lý và local cache của PBS cũ. PBS mới cần nhận lại (adopt) bucket đó.", "steps": [{"t": "Tắt hẳn PBS cũ trước. Trên PBS mới: tạo lại vùng cache trống (ZFS hoặc SSD đều được) và cấp quyền", "cmds": ["zfs create -o mountpoint=/s3-recovery-cache <pool>/s3-recovery-cache", "chown backup:backup /s3-recovery-cache", "chmod 700 /s3-recovery-cache"]}, {"t": "Tạo lại S3 Endpoint y hệt cũ (cùng Endpoint, Access/Secret Key, Fingerprint, tích Path Style)", "cmds": []}, {"t": "Add Datastore: đặt lại cùng Name với datastore cũ, Local Cache = /s3-recovery-cache, chọn S3 Endpoint vừa tạo, Bucket = đúng tên bucket cũ. Advanced bắt buộc tích Overwrite in-use marker để PBS mới giành quyền kiểm soát bucket khỏi PBS cũ", "cmds": []}, {"t": "Vào Datastore, Content: danh sách backup sẽ hiện ra sau vài giây khi PBS tải metadata từ S3 về cache", "cmds": []}, {"t": "Trên PVE: xóa liên kết tới PBS cũ, thêm PBS mới, chọn VM, Backup, chọn bản backup, Restore, rồi kiểm tra dữ liệu trong VM", "cmds": ["qmrestore <backup-volume> <vmid>"]}], "notes": "Nếu PBS cũ có bật Encryption thì phải có file encryption key (.json) hoặc mật khẩu, mất key là mất dữ liệu vĩnh viễn dù S3 còn. Gặp ENOENT hoặc Permission denied thì chạy chown -R backup:backup <thư mục cache>. Chỉ tích Overwrite in-use marker khi chắc PBS cũ đã tắt hẳn."}, {"id": "rb-ceph-upgrade-quincy-reef-squid", "kind": "runbook", "scope": "ceph", "title": "Nâng cấp Ceph Quincy 17.2.8 → Reef 18.2.8 → Squid 19.2.4 trên PVE 8.4 (3 node, có CephFS)", "tags": "runbook nâng cấp upgrade ceph quincy reef squid pve 8.4 3 node hyper-converged cephfs mds mon mgr osd flags", "goal": "Nâng Ceph hai bước liên tiếp (Quincy lên Reef, rồi Reef lên Squid) trên cluster 3 node hyper-converged (mỗi node có MON, MGR, OSD, MDS), PVE giữ nguyên 8.4. Ghi chú gốc dừng ở PVE 8.4 + Squid 19.2.4; bước tiếp theo là pve8to9.", "prereq": "ceph -s = HEALTH_OK, toàn bộ OSD up/in, quorum MON đủ 3/3. Degraded phải về 0 mới nâng cấp; scrub, deep-scrub, backfilling chỉ cần theo dõi và ghi baseline (không bắt buộc dừng) miễn là không HEALTH_ERR và tốc độ ổn định. Ghi lại rank MDS nào đang active ở node nào để dự đoán failover. Làm tuần tự Node1 rồi Node2 rồi Node3, không nâng hai node cùng lúc.", "steps": [{"t": "Kiểm tra trạng thái trước khi bắt đầu (chạy một lần, từ node bất kỳ)", "cmds": ["ceph -s", "ceph health detail", "ceph osd df tree", "ceph mon stat", "pvecm status", "ceph fs status", "ceph versions"]}, {"t": "Trên từng node: xác nhận repo hiện tại là quincy rồi đổi sang reef", "cmds": ["cat /etc/apt/sources.list.d/ceph.list", "sed -i 's/quincy/reef/' /etc/apt/sources.list.d/ceph.list", "apt update", "apt policy ceph-osd"]}, {"t": "Xác nhận Candidate là 18.2.8-pve1 từ đúng repo ceph-reef rồi mới cài thật, sau đó kiểm tra đã cài đúng bản", "cmds": ["apt full-upgrade -y", "apt policy ceph-osd", "dpkg -l | grep ceph-osd"]}, {"t": "Maintain Ceph (chỉ một lần, áp dụng toàn cluster): đặt 6 cờ noout / nobackfill / norecover / norebalance / noscrub / nodeep-scrub (xem runbook bảo trì production)", "cmds": ["ceph osd set noout", "ceph osd set nobackfill", "ceph osd set norecover", "ceph osd set norebalance", "ceph osd set noscrub", "ceph osd set nodeep-scrub"]}, {"t": "Restart theo đúng thứ tự, từng lệnh kiểm tra ceph -s trước khi đi tiếp. MON trước, quorum phải còn đủ", "cmds": ["systemctl restart ceph-mon.target", "ceph -s"]}, {"t": "Tiếp theo MGR", "cmds": ["systemctl restart ceph-mgr.target", "ceph -s"]}, {"t": "Rồi OSD. Có thể tạm thấy peering hoặc X osds down, đợi 10 đến 15 giây rồi kiểm tra lại, không chạy thêm lệnh khác", "cmds": ["systemctl restart ceph-osd.target", "ceph -s"]}, {"t": "Cuối cùng MDS. Node giữ rank active của CephFS sẽ failover ngắn, đó là bình thường", "cmds": ["systemctl restart ceph-mds.target", "ceph -s", "ceph fs status"]}, {"t": "Cách cẩn trọng hơn cho MDS khi max_mds lớn hơn 1 (ghi chú gốc): dừng hết MDS standby, đặt max_mds = 1, restart MDS active, rồi trả max_mds lại", "cmds": ["ceph fs set <fsname> max_mds 1", "systemctl stop ceph-mds@<standby-id>", "systemctl restart ceph-mds@<active-id>", "ceph fs set <fsname> max_mds 2"]}, {"t": "Khi cả 3 node xong: chốt phiên bản tối thiểu (bước này theo hướng dẫn Proxmox, ghi chú gốc chưa có), bỏ 6 cờ, theo dõi recovery", "cmds": ["ceph osd require-osd-release reef", "ceph osd unset noout", "ceph osd unset nobackfill", "ceph osd unset norecover", "ceph osd unset norebalance", "ceph osd unset noscrub", "ceph osd unset nodeep-scrub", "ceph versions"]}, {"t": "Bước 2, Reef lên Squid: lặp lại đúng quy trình trên, chỉ đổi repo. Candidate phải là 19.2.4-1~bpo12+1 từ ceph-squid", "cmds": ["sed -i 's/reef/squid/' /etc/apt/sources.list.d/ceph.list", "apt update", "apt policy ceph-osd", "apt full-upgrade -y"]}, {"t": "Sau Squid: restart MON, MGR, OSD, MDS như trên, rồi chốt phiên bản và bỏ cờ", "cmds": ["ceph osd require-osd-release squid", "ceph versions"]}], "notes": "Điều kiện đạt mỗi bước: HEALTH_OK và ceph versions cho mon/mgr/osd/mds đều đúng phiên bản mới. Trạng thái đạt được: PVE 8.4 + Ceph Squid 19.2.4. Bước kế tiếp là nâng PVE 8 lên 9 (pve8to9) khi Ceph đã ở Squid. Xem thêm case nâng cấp Ceph (có nguồn Proxmox wiki) và case MDS."}, {"id": "rb-prod-maintenance", "kind": "runbook", "scope": "pve", "title": "Bảo trì production: tắt HA và đặt cờ bảo trì Ceph trước khi tắt node", "tags": "runbook bảo trì maintenance production tắt ha pve-ha-lrm pve-ha-crm ceph flags noout nobackfill norecover norebalance noscrub nodeep-scrub manage global flags", "goal": "Tắt hoặc reboot node trong môi trường production mà không kích hoạt fencing/HA di chuyển VM đồng loạt, và không để Ceph backfill/recovery không cần thiết.", "prereq": "Kiểm tra sức khỏe Ceph trước (ceph -s). Tránh thao tác khi đang có cảnh báo Warn hoặc Err nếu chưa được cấp trên cho phép.", "steps": [{"t": "Kiểm tra trước khi làm", "cmds": ["ceph -s", "ha-manager status"]}, {"t": "Tắt HA. Lý do: nếu không, khi một node dừng, fencing đánh dấu node dead rồi các VM được dừng và khởi động lại trên host khác; số VM lớn đồng loạt bật lên làm tràn RAM và gây sập dây chuyền (domino). Dừng pve-ha-lrm ở TẤT CẢ các host trước", "cmds": ["systemctl stop pve-ha-lrm"]}, {"t": "Sau khi lrm đã dừng ở mọi host mới dừng pve-ha-crm. Không làm đồng loạt cả hai", "cmds": ["systemctl stop pve-ha-crm"]}, {"t": "Maintain Ceph. Lý do: tắt node hoặc dừng OSD không báo trước thì cluster coi là mất đột ngột, báo HEALTH_WARN/ERR và backfill sang OSD khác, gây I/O thừa ảnh hưởng workload. Trên GUI: Ceph, OSD, Manage Global Flags, chọn 6 cờ rồi Apply. Dòng lệnh tương đương", "cmds": ["ceph osd set noout", "ceph osd set nobackfill", "ceph osd set norecover", "ceph osd set norebalance", "ceph osd set noscrub", "ceph osd set nodeep-scrub"]}, {"t": "Xác nhận 6 cờ đã bật", "cmds": ["ceph osd dump | grep flags", "ceph -s"]}, {"t": "Thực hiện bảo trì (tắt, sửa, reboot node), chờ node và OSD lên lại", "cmds": ["ceph osd stat", "pvecm status"]}, {"t": "Hoàn tác: bỏ 6 cờ trước", "cmds": ["ceph osd unset noout", "ceph osd unset nobackfill", "ceph osd unset norecover", "ceph osd unset norebalance", "ceph osd unset noscrub", "ceph osd unset nodeep-scrub"]}, {"t": "Bật lại HA (thứ tự start không có trong ghi chú gốc, thường lrm rồi crm), kiểm tra", "cmds": ["systemctl start pve-ha-lrm", "systemctl start pve-ha-crm", "ha-manager status"]}], "notes": "Quên bỏ cờ sau bảo trì là lỗi hay gặp, xem case cờ bảo trì còn sót. Ngoài ra cần đủ RAM dự phòng (N+1) để các VM của một node chết vẫn chạy được trên node còn lại."}, {"id": "rb-pbs-s3-datastore", "kind": "runbook", "scope": "pve", "title": "PBS: tạo Datastore S3 với local cache ZFS và backup từ PVE", "tags": "runbook pbs proxmox backup server s3 datastore local cache zfs endpoint path style bucket backup dedup", "goal": "Dùng một bucket S3 (nhà cung cấp S3-compatible) làm datastore của PBS 4.x, có vùng đệm local cache trên ZFS, rồi thêm vào PVE và backup thử.", "prereq": "PBS 4.x đã cài. Có Access Key và Secret Key của nhà cung cấp S3. Có một SSD hoặc mảng ZFS làm cache. Datastore S3 hiện ghi là tech preview.", "steps": [{"t": "Tạo cache ZFS với điểm mount riêng, không lồng trong datastore local khác (tránh lỗi nested datastore), cấp quyền cho user backup", "cmds": ["zfs create -o mountpoint=/s3-cache <pool>/s3-cache", "chown backup:backup /s3-cache", "chmod 700 /s3-cache"]}, {"t": "Trên PBS Web GUI: Configuration, S3 Endpoints, Add. Điền ID, Endpoint (<s3-endpoint>), Access Key, Secret Key, tích Path Style (bắt buộc), Fingerprint (<fingerprint>)", "cmds": []}, {"t": "Datastore, Add Datastore: Name, Type = S3 (tech preview), Local Cache = /s3-cache, S3 Endpoint ID, Bucket = <bucket>. Mục Advanced tích Overwrite in-use marker (cho phép datastore này giành quyền kiểm soát bucket đang bị đánh dấu in-use, xem runbook khôi phục khi PBS hỏng)", "cmds": []}, {"t": "Trên PVE: Datacenter, Storage, Add, Proxmox Backup Server, rồi backup thử một VM", "cmds": ["vzdump <vmid> --storage <pbs-storage> --mode snapshot"]}, {"t": "Kết quả mong đợi: thấy thư mục vm/<vmid> ở phần Content của datastore S3", "cmds": []}], "notes": "Dung lượng trên S3 thường nhỏ hơn nhiều so với đĩa VM (ví dụ VM đĩa 50GB chỉ khoảng 2.4GB) nhờ deduplication, nén, và bỏ qua vùng trống. Nếu bật Encryption thì phải lưu file key mã hóa (.json) hoặc mật khẩu ở nơi an toàn: mất key là mất dữ liệu vĩnh viễn dù S3 còn nguyên. Thư mục cache phải thuộc user backup, nếu gặp ENOENT hoặc Permission denied thì chạy chown -R backup:backup <đường dẫn cache>."}, {"id": "rb-pve5-to-8-single", "kind": "runbook", "scope": "pve", "title": "Nâng cấp một node Proxmox VE từ 5.4 lên 8.x (qua 6, 7, 8) kèm ZFS", "tags": "runbook nâng cấp upgrade proxmox 5.4 6 7 8 stretch buster bullseye bookworm single node zfs rpool zpool import upgrade apt dist-upgrade", "goal": "Nâng một node đơn Proxmox rất cũ (5.4, Debian stretch) lên 8.x theo chuỗi 5 lên 6 lên 7 lên 8, rồi import lại các zpool dữ liệu.", "prereq": "Xác định chính xác đĩa boot (đơn hoặc ZFS RAID1), lưu WWN/SN để nếu hỏng có thể cài mới OS và import lại zpool. Backup /etc/network/interfaces, /etc/pve/, /etc/hosts. Ghi lại tên các zfs pool. Nên chạy bộ kiểm tra có sẵn của từng bản (pve5to6, pve6to7, pve7to8 --full) trước mỗi bước (gợi ý bổ sung, ghi chú gốc chưa có).", "steps": [{"t": "Chuẩn bị", "cmds": ["zpool status rpool", "lsblk -o NAME,SIZE,SERIAL,WWN"]}, {"t": "5.x: thêm repo no-subscription (lưu ý đúng tên file sources.list và dùng dấu nháy thẳng)", "cmds": ["echo \"deb http://download.proxmox.com/debian/pve stretch pve-no-subscription\" >> /etc/apt/sources.list"]}, {"t": "Debian stretch đã hết hỗ trợ nên repo cũ không dùng được. Comment các dòng ftp.debian.org / security.debian.org cũ và dùng archive.debian.org", "cmds": ["deb http://archive.debian.org/debian stretch main contrib", "deb http://archive.debian.org/debian stretch-updates main", "deb http://archive.debian.org/debian-security stretch/updates main"]}, {"t": "Cập nhật lên bản mới nhất của 5.x rồi reboot", "cmds": ["apt update", "apt dist-upgrade", "reboot"]}, {"t": "5 lên 6: đổi suite, bỏ repo enterprise bằng cách thêm # vào /etc/apt/sources.list.d/pve-enterprise.list, nâng cấp. Các lựa chọn Y/N mặc định chọn N, rồi reboot để chạy kernel mới", "cmds": ["sed -i 's/stretch/buster/g' /etc/apt/sources.list", "apt update", "apt dist-upgrade", "reboot"]}, {"t": "6 lên 7", "cmds": ["sed -i 's/buster\\/updates/bullseye-security/g;s/buster/bullseye/g' /etc/apt/sources.list", "apt update", "apt dist-upgrade", "reboot"]}, {"t": "7 lên 8", "cmds": ["sed -i -e 's/bullseye/bookworm/g' /etc/apt/sources.list", "apt update", "apt dist-upgrade", "reboot"]}, {"t": "Import lại các zpool DATA (theo tên, hoặc theo by-id), rồi nâng feature cho từng pool dữ liệu", "cmds": ["zpool import", "zpool import <pool-name> -f -d /dev/disk/by-id/", "zpool upgrade <pool-name>"]}, {"t": "Kiểm tra toàn bộ dữ liệu của pool", "cmds": ["zpool status <pool-name>", "zfs list"]}], "notes": "Nếu apt báo không tìm thấy buster hoặc bullseye trên ftp.debian.org, các bản này cũng có thể đã chuyển sang archive.debian.org, đổi tương tự bước stretch. zpool upgrade không hoàn tác được và chỉ nên chạy cho pool dữ liệu, không chạy cho rpool nếu chưa chắc bootloader hỗ trợ các feature mới (có thể làm node không boot). Cluster nhiều node thì phải theo hướng dẫn chính thức của Proxmox vì còn bước nâng corosync, bài này chỉ cho node đơn."}, {"id": "rb-san-iscsi-shared-lvm", "kind": "runbook", "scope": "pve", "title": "SAN iSCSI + Shared LVM cho cluster Proxmox, và mở rộng dung lượng online (pvmove)", "tags": "runbook san iscsi lvm shared targetcli open-iscsi lun volume group pvmove vgextend mở rộng dung lượng block storage", "goal": "Cho 3 node Proxmox cùng đăng nhập một LUN iSCSI và dùng chung một Volume Group (Shared LVM) để chia volume cho VM; sau đó mở rộng dung lượng không mất dữ liệu, không downtime.", "prereq": "Một máy storage làm iSCSI target, 3 node Proxmox truy cập được tới nó. Mô hình: các node, iSCSI initiator, iSCSI target, LUN, Shared LVM, mỗi LV là một đĩa VM.", "steps": [{"t": "Trên máy storage: cài và cấu hình iSCSI target (block backstore). Các lệnh trong targetcli shell", " function paint(){
  if(getComputedStyle(wires).display==='none')return;
  const m=map.getBoundingClientRect(),r=root.getBoundingClientRect();
  wires.setAttribute('width',m.width);wires.setAttribute('height',m.height);
  const y1=r.top+r.height/2-m.top;let out='';

}
function copy(el,text){
  if(!navigator.clipboard)return;
  navigator.clipboard.writeText(text).then(()=>{
    const old=el.textContent;el.textContent='Copied';
    setTimeout(()=>{el.textContent=old;draw()},700);
  },()=>{});
}

function build(side,branches,holder,title){
  const h=document.createElement('p');h.className='sidehead';h.textContent=title;holder.appendChild(h);
  branches.forEach(b=>{
    const n=b.subs.reduce((a,s)=>a+s.items.length,0);
    const sec=document.createElement('section');sec.className='branch '+side;sec.dataset.side=side;
    const btn=document.createElement('button');btn.type='button';btn.className='bhead';btn.setAttribute('aria-expanded','false');
    const id=document.createElement('span');id.className='bid';id.textContent=b.id;
    const nm=document.createElement('span');nm.className='bname';nm.textContent=b.name;
    const ct=document.createElement('span');ct.className='bcount';ct.textContent=n;
    const sb=document.createElement('span');sb.className='bsubs';sb.textContent=b.subs.map(s=>s.name).join(' · ');
    btn.append(id,nm,sb,ct);
    sec.id=b.id;
    const body=document.createElement('div');body.className='bbody';body.hidden=true;
    b.subs.forEach(s=>{
      const sub=document.createElement('div');sub.className='sub';
      const t=document.createElement('div');t.className='subname';t.textContent=s.name;sub.appendChild(t);
      const ul=document.createElement('ul');
      s.items.forEach(it=>{
        const li=document.createElement('li');if(it.d)li.className='danger';
        li.dataset.t=N(it.c+' '+it.p+' '+(it.v||'')+' '+(it.k||'')+' '+s.name+' '+b.name);
        const c=document.createElement('code');c.textContent=it.c;c.title='Click to copy';c.tabIndex=0;
        c.addEventListener('click',()=>copy(c,it.c));
        c.addEventListener('keydown',e=>{if(e.key==='Enter')copy(c,it.c)});
        const w=document.createElement('span');w.className='why';w.textContent=it.p;
        if(it.v){const vv=document.createElement('span');vv.className='vi';vv.textContent=it.v;li.append(c,vv,w)}else li.append(c,w);ul.appendChild(li);
      });
      sub.appendChild(ul);body.appendChild(sub);
    });
    btn.addEventListener('click',()=>{setOpen(sec,body.hidden);draw()});
    if(REPO&&SLUGS[b.id]){const a=document.createElement('a');a.className='gh';a.href='https://github.com/'+REPO+'/blob/main/docs/'+SLUGS[b.id];a.textContent='mở file .md';a.target='_blank';a.rel='noopener';body.prepend(a)}
    sec.append(btn,body);holder.appendChild(sec);
  });
}

    if(toks.every(w=>t.includes(w)))hits.push({b,it});
  })));
  const ch=CASES.filter(c=>toks.every(w=>ct(c).includes(w)));
  const head=el('div','rhead');
  head.append(el('span',null,'Kết quả: '+hits.length+' lệnh, '+ch.length+' case'));
  if(hits.length||ch.length){
    const pb=el('button','pbtn','Copy prompt cho Claude');pb.type='button';
    pb.addEventListener('click',()=>copy(pb,mkPrompt('"'+q.value.trim()+'"','',hits.slice(0,15).map(h=>h.it.c))));
    head.append(pb);
  }
  res.append(head);
  ch.forEach(c=>{const a=el('a','rcase',(c.kind==='runbook'?'Runbook: ':c.scope==='pve'?'Case Proxmox: ':'Case Ceph: ')+c.title);a.href='#case-'+c.id;res.append(a)});
  hits.slice(0,30).forEach(({b,it})=>{
    const row=el('div','rrow');const a=el('a',null,b.id);a.href='#'+b.id;
    const box=el('div');box.append(cmdEl(it.c),el('span','vi',it.v||it.p));
    row.append(a,box);res.append(row);
  });
  if(hits.length>30)res.append(el('p','note','Còn '+(hits.length-30)+' lệnh nữa, thu hẹp từ khóa để xem.'));
  res.hidden=false;
}
['osd down','đầy disk','lệch giờ','mất quorum','slow ops','pg inconsistent','reboot bảo trì','thay đĩa','vm lock','đăng xuất','rgw 503','migrate','backup lỗi','dấu hỏi','nâng cấp','bảo trì','crash'].forEach(x=>{
  const b=el('button','chip',x);b.type='button';
  b.addEventListener('click',()=>{q.value=x;q.dispatchEvent(new Event('input'))});$('#chips').append(b)});
const jump=$('#jump');
[['Proxmox',DATA.left],['Ceph',DATA.right]].forEach(([n,arr])=>{jump.append(el('b',null,n+':'));arr.forEach(b=>{const a=el('a','jl',b.id);a.href='#'+b.id;a.title=b.name;jump.append(a)})});
function openHash(){
  const id=decodeURIComponent(location.hash.slice(1));if(!id)return;
  if(id==='cases'||id==='cases-ceph'){show('ceph');return}
  if(id==='cases-pve'){show('pve');return}
  if(id==='runbooks'||id==='cases-run'){show('run');return}
  if(id.startsWith('case-')){const cc=CASES.find(c=>'case-'+c.id===id);show(cc&&cc.kind==='runbook'?'run':cc&&cc.scope==='pve'?'pve':'ceph');const d=document.getElementById(id);if(d){d.hidden=false;d.open=true;d.scrollIntoView({block:'start'})}return}
  show('map');
  const sec=document.getElementById(id);if(!sec||!sec.classList.contains('branch'))return;
  setOpen(sec,true);draw();sec.scrollIntoView({block:'center'});
}
window.addEventListener('hashchange',openHash);
document.querySelectorAll('.branch').forEach(sec=>sec.querySelector('.bhead').addEventListener('click',()=>{
  if(!sec.querySelector('.bbody').hidden)history.replaceState(null,'','#'+sec.id)}));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();q.select()}
  if(e.key==='Escape'&&document.activeElement===q){q.value='';q.dispatchEvent(new Event('input'));q.blur()}
});
const qp=new URLSearchParams(location.search).get('q');
if(qp){q.value=qp;q.dispatchEvent(new Event('input'))}
q.placeholder='Lọc lệnh  (nhấn /)';
openHash();
draw();
</script>
