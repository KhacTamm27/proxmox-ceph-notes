name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        run: python scripts/build.py --repo ${{ github.repository }}
      - name: Search tests
        run: node scripts/check_search.js
      - name: Link check
        run: python scripts/check_links.py
